    <style>
      :root {
        --bg: #050505;
        --bg-2: #0a0a0a;
        --panel: rgba(14, 14, 14, 0.72);
        --panel-2: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.08);
        --muted: rgba(255, 255, 255, 0.68);
        --muted-2: rgba(255, 255, 255, 0.44);
        --text: #ffffff;
        --fb: #0866ff;
        --radius-xl: 34px;
        --radius-lg: 24px;
        --radius-md: 18px;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        --max: 1160px;
        --transition: 280ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 16% 18%, rgba(8, 102, 255, 0.18) 0%, rgba(8, 102, 255, 0.08) 18%, transparent 42%),
          radial-gradient(circle at 84% 14%, rgba(255, 255, 255, 0.08) 0%, transparent 34%),
          radial-gradient(circle at 72% 80%, rgba(8, 102, 255, 0.12) 0%, transparent 28%),
          linear-gradient(180deg, #0b1019 0%, #050505 100%);
        overflow-x: hidden;
        position: relative;
      }

      a {
        color: inherit;
      }

      .fb-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        isolation: isolate;
      }

      .fb-bg::before,
      .fb-bg::after {
        content: "";
        position: absolute;
        inset: -8%;
        pointer-events: none;
      }

      .fb-bg::before {
        background: radial-gradient(circle at 18% 24%, rgba(8, 102, 255, 0.22) 0%, transparent 34%), radial-gradient(circle at 78% 22%, rgba(255, 255, 255, 0.08) 0%, transparent 24%), radial-gradient(circle at 62% 76%, rgba(8, 102, 255, 0.14) 0%, transparent 28%);
        filter: blur(36px);
        opacity: 0.92;
        animation: fbGradientDriftA 18s ease-in-out infinite alternate;
      }

      .fb-bg::after {
        background: linear-gradient(135deg, rgba(8, 102, 255, 0.06) 0%, transparent 38%, rgba(255, 255, 255, 0.03) 62%, transparent 100%);
        filter: blur(54px);
        opacity: 0.88;
        animation: fbGradientDriftB 24s ease-in-out infinite alternate;
      }

      .fb-watermark {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(8, 102, 255, 0.16);
        mix-blend-mode: screen;
        will-change: transform, opacity, filter;
      }

      .fb-watermark--a {
        top: 50%;
        left: 58%;
        width: clamp(340px, 54vw, 860px);
        transform: translate3d(-50%, -50%, 0) rotate(-12deg) scale(1);
        opacity: 0.08;
        filter: blur(13px);
        animation: fbLogoFloatA 18s ease-in-out infinite alternate,
                   fbLogoPulse 9s ease-in-out infinite;
      }

      .fb-watermark--b {
        top: 16%;
        right: -4%;
        width: clamp(180px, 24vw, 360px);
        transform: rotate(-8deg) scale(0.96);
        opacity: 0.035;
        filter: blur(18px);
        animation: fbLogoFloatB 22s ease-in-out infinite alternate,
                   fbLogoPulse 11s ease-in-out infinite reverse;
      }

      .fb-logo-wrap {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .fb-logo-wrap .fb-wordmark,
      .fb-logo-wrap .fb-separator,
      .fb-logo-wrap .fb-canales-logo {
        display: none !important;
      }

      .fb-logo-wrap .fb-logo,
      .fb-logo-wrap .fb-giphy-logo,
      .fb-logo-wrap .fb-instagram-logo,
      .fb-logo-wrap .fb-tiktok-logo,
      .fb-logo-wrap img,
      .fb-logo-wrap svg {
        display: block;
        width: 100% !important;
        height: auto !important;
        max-width: none;
        object-fit: contain;
        color: rgba(8, 102, 255, 0.16);
      }

      .fb-bg .fb-logo-wrap svg,
      .fb-bg .fb-logo-wrap img {
        opacity: 1;
      }

      .fb-bg .fb-logo-wrap path,
      .fb-bg .fb-logo-wrap rect,
      .fb-bg .fb-logo-wrap circle {
        vector-effect: non-scaling-stroke;
      }

      .fb-bg .fb-logo-mark {
        width: 78% !important;
        max-width: 540px;
      }
      @keyframes fbGradientDriftA {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(-2.2%, 2.8%, 0) scale(1.04); }
      }

      @keyframes fbGradientDriftB {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(2.6%, -2.4%, 0) scale(1.06); }
      }

      @keyframes fbLogoFloatA {
        0% { transform: translate3d(-50%, -50%, 0) rotate(-12deg) scale(1); }
        100% { transform: translate3d(-48%, -52%, 0) rotate(-8deg) scale(1.05); }
      }

      @keyframes fbLogoFloatB {
        0% { transform: translate3d(0, 0, 0) rotate(-8deg) scale(0.96); }
        100% { transform: translate3d(-1.4vw, 2.2vh, 0) rotate(-12deg) scale(1.02); }
      }

      @keyframes fbLogoPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.86; }
      }

      @media (max-width: 900px) {
        .fb-watermark--a {
          left: 50%;
          width: clamp(280px, 68vw, 620px);
          opacity: 0.068;
          filter: blur(10px);
        }

        .fb-watermark--b {
          top: 11%;
          right: auto;
          left: 74%;
          width: clamp(150px, 24vw, 240px);
          opacity: 0.03;
          filter: blur(13px);
        }
      }

      @media (max-width: 520px) {
        .fb-watermark--a {
          left: 50%;
          top: 47%;
          width: min(92vw, 460px);
          opacity: 0.094;
          filter: blur(11px);
        }

        .fb-watermark--b {
          top: 8%;
          left: 72%;
          width: min(40vw, 170px);
          opacity: 0.042;
          filter: blur(15px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .fb-watermark--a,
        .fb-watermark--b {
          animation: none !important;
        }

        .fb-bg::before,
        .fb-bg::after {
          animation: none !important;
        }
      }


      @keyframes floatOne {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(70px, 40px, 0) scale(1.08); }
      }

      @keyframes floatTwo {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(-70px, 46px, 0) scale(1.08); }
      }

      @keyframes floatThree {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(28px, -34px, 0) scale(1.08); }
      }

      .fb-shell {

      }

      .fb-name {
        margin: 0 0 10px;

      .fb-username-wrap {

      .fb-username {

      .fb-right-card {
        border-radius: var(--radius-xl);

      .fb-stats {
        display: grid;

      .fb-stat {
        display: grid;

      .fb-note {

      @media (max-width: 900px) {

      /* Mobile centering final patch */
      @media (max-width: 900px) {

          min-height: 100vh;
          padding: 20px 14px 28px;
        }
        .fb-layout { justify-items: center; }
        .fb-left,
        .fb-right {

        .fb-lockup {

    <script>
      const usernameEl = document.getElementById("fbUsername");
      const handleInlineEl = document.getElementById("fbHandleInline");
      const ctaEl = document.getElementById("fbCta");

      function normalizeHandle(text) {
        return text.trim().replace(/^@+/, "");
      }

      function getBaseFontSize(len, compact) {
        const desktopRules = [
          { max: 8, size: 108 },
          { max: 10, size: 94 },
          { max: 12, size: 82 },
          { max: 14, size: 72 },
          { max: 16, size: 64 },
          { max: 18, size: 58 },
          { max: 99, size: 52 }
        ];

        const mobileRules = [
          { max: 8, size: 52 },
          { max: 10, size: 46 },
          { max: 12, size: 40 },
          { max: 14, size: 35 },
          { max: 16, size: 31 },
          { max: 18, size: 28 },
          { max: 99, size: 26 }
        ];

        const rules = compact ? mobileRules : desktopRules;
        return rules.find(rule => len <= rule.max).size;
      }

      function fitUsernameToWidth() {
        if (!usernameEl) return;

        const wrap = usernameEl.parentElement;
        if (!wrap) return;

        const rawText = usernameEl.textContent.trim();
        const compact = window.innerWidth <= 900;
        let size = getBaseFontSize(rawText.length, compact);
        const min = compact ? 24 : 40;
        const available = Math.max(0, wrap.clientWidth - 2);

        usernameEl.style.fontSize = size + "px";
        usernameEl.style.maxWidth = "100%";
        usernameEl.style.whiteSpace = "nowrap";

        while (usernameEl.scrollWidth > available && size > min) {
          size -= 1;
          usernameEl.style.fontSize = size + "px";
        }
      }

      function syncProfileData() {
        if (!usernameEl || !ctaEl) return;

        const rawText = usernameEl.textContent.trim();
        const handle = normalizeHandle(rawText);

        if (handleInlineEl) {
          handleInlineEl.textContent = handle;
        }

        ctaEl.href = "https://www.facebook.com/" + handle;
        fitUsernameToWidth();
      }

      syncProfileData();
      window.addEventListener("resize", () => window.requestAnimationFrame(syncProfileData));

      if (usernameEl) {
        const observer = new MutationObserver(() => window.requestAnimationFrame(syncProfileData));
        observer.observe(usernameEl, {
          childList: true,
          characterData: true,
          subtree: true
        });
      }
    </script>
