  <style>
    :root {
      --fb-blue: #0865FE;
      --fb-blue-dark: #0758DE;
      --white: #FFFFFF;
      --ink: #17181C;
      --muted: rgba(23,24,28,.64);
      --max: 1160px;
      --ease: cubic-bezier(.2,.8,.2,1);
      --font: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }

    body {
      margin: 0;
      min-width: 0;
      min-height: 100svh;
      overflow-x: hidden;
      background: #fff;
      color: var(--ink);
      font-family: var(--font);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== 50 / 50 SPLIT ===== */
    .fb-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      pointer-events: none;
    }

    .fb-half {
      position: relative;
      overflow: hidden;
    }

    .fb-half--blue {
      background: var(--fb-blue);
    }

    .fb-half--blue::before {
      content: "";
      position: absolute;
      inset: -18%;
      background:
        radial-gradient(circle at 25% 28%, rgba(255,255,255,.12), transparent 0 22%),
        radial-gradient(circle at 72% 76%, rgba(255,255,255,.07), transparent 0 20%);
      filter: blur(42px);
      opacity: .72;
    }

    .fb-half--white {
      background:
        radial-gradient(circle at 76% 22%, rgba(8,101,254,.025), transparent 0 24%),
        #fff;
    }

    /* ===== SAME PORTAL ARCHITECTURE AS INSTAGRAM ===== */
    .fb-shell {
      position: relative;
      z-index: 2;
      width: min(100%, var(--max));
      min-height: 100svh;
      margin: 0 auto;
      padding:
        max(28px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
    }

    .fb-layout {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
      gap: clamp(28px, 5vw, 64px);
      align-items: center;
    }

    .fb-left {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      color: #fff;
    }

    .fb-lockup {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-height: 34px;
      max-width: 100%;
      margin-bottom: clamp(24px, 3vw, 34px);
      animation: reveal .7s .05s both;
    }

    .fb-logo {
      width: 31px;
      height: 31px;
      display: block;
      object-fit: cover;
      object-position: center;
      border-radius: 8px;
      flex: 0 0 auto;
    }

    .fb-separator {
      font-size: .9rem;
      line-height: 1;
      font-weight: 800;
      color: rgba(255,255,255,.50);
    }

    .fb-canales-logo {
      display: block;
      width: auto;
      height: 21px;
      max-width: min(40vw, 118px);
      object-fit: contain;
    }

    .fb-name {
      margin: 0 0 10px;
      font-size: clamp(1.02rem, 1.6vw, 1.24rem);
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: -.018em;
      color: rgba(255,255,255,.78);
      animation: reveal .7s .12s both;
    }

    .fb-handle-wrap {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding-right: clamp(12px, 2vw, 24px);
      overflow: hidden;
      container-type: inline-size;
    }

    .fb-handle {
      display: inline-block;
      margin: -.08em -.11em -.12em;
      padding: .08em .11em .12em;
      max-width: 100%;
      white-space: nowrap;
      font-size: clamp(2.55rem, 5.7vw, 4.55rem);
      line-height: .92;
      font-weight: 850;
      letter-spacing: -.068em;
      color: #fff;
      animation: reveal .78s .18s both;
    }

    @supports (font-size: 1cqw) {
      .fb-handle {
        font-size: clamp(2.5rem, 10.7cqw, 4.55rem);
      }
    }

    .fb-right {
      min-width: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .fb-actions {
      position: relative;
      width: 100%;
      max-width: 420px;
      display: grid;
      gap: 14px;
      animation: reveal-card .8s .22s both;
    }

    .fb-btn {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 72px;
      padding: 20px 42px;
      border: 0;
      border-radius: 999px;
      text-align: center;
      font-size: 1rem;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -.018em;
      transition:
        transform .34s var(--ease),
        box-shadow .34s var(--ease),
        background-color .28s ease,
        color .28s ease,
        opacity .28s ease;
    }

    .fb-btn .label {
      position: relative;
      z-index: 4;
    }

    .fb-btn--primary {
      color: #fff;
      background: var(--fb-blue);
      box-shadow: 0 12px 28px rgba(8,101,254,.18);
      overflow: visible;
    }

    .fb-btn--secondary {
      min-height: 64px;
      color: rgba(23,24,28,.82);
      background: #fff;
      box-shadow: inset 0 0 0 1px rgba(23,24,28,.14);
    }

    /* ===== REACTION BURST ===== */
    .reaction-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: visible;
      pointer-events: none;
    }

    .reaction {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--size, 42px);
      height: var(--size, 42px);
      object-fit: contain;
      opacity: 0;
      transform:
        translate(-50%, -50%)
        translate3d(0,0,0)
        scale(.42)
        rotate(0deg);
      filter: drop-shadow(0 9px 14px rgba(0,0,0,.16));
      will-change: transform, opacity;
      animation:
        reaction-burst var(--dur, 980ms) cubic-bezier(.16,.72,.18,1) var(--delay,0ms) forwards;
    }

    @keyframes reaction-burst {
      0% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          translate3d(0,0,0)
          scale(.30)
          rotate(0deg);
      }

      12% {
        opacity: 1;
      }

      68% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          translate3d(var(--tx), var(--ty), 0)
          scale(var(--scale,1))
          rotate(var(--rot,0deg));
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .fb-btn--primary:hover,
      .fb-btn--primary:focus-visible {
        transform: translateY(-3px) scale(1.008);
        background: var(--fb-blue-dark);
        box-shadow:
          0 18px 38px rgba(8,101,254,.24);
      }

      .fb-btn--secondary:hover,
      .fb-btn--secondary:focus-visible {
        transform: translateY(-2px);
        box-shadow:
          inset 0 0 0 1px rgba(23,24,28,.20),
          0 8px 18px rgba(23,24,28,.05);
      }
    }

    .fb-btn:active {
      transform: translateY(0) scale(.985) !important;
    }

    .fb-btn:focus-visible {
      outline: 3px solid rgba(8,101,254,.24);
      outline-offset: 4px;
    }

    @media (max-width: 900px) {
      .fb-stage {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }

      .fb-shell {
        min-height: 100svh;
        align-items: stretch;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }

      .fb-layout {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
        gap: 0;
      }

      .fb-left,
      .fb-right {
        width: 100%;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .fb-left {
        align-items: center;
        padding-bottom: 18px;
      }

      .fb-right {
        padding-top: 18px;
      }

      .fb-handle-wrap {
        display: flex;
        justify-content: center;
        padding-right: 0;
      }

      .fb-actions {
        max-width: 470px;
      }
    }

    @media (max-width: 560px) {
      .fb-shell {
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }

      .fb-lockup {
        gap: 9px;
        margin-bottom: 20px;
      }

      .fb-logo {
        width: 27px;
        height: 27px;
      }

      .fb-canales-logo {
        height: 18px;
      }

      .fb-name {
        font-size: 1rem;
        margin-bottom: 8px;
      }

      .fb-handle {
        font-size: clamp(1.9rem, 9.3vw, 3.05rem);
        letter-spacing: -.055em;
      }

      .fb-btn {
        min-height: 64px;
        padding: 18px 28px;
      }

      .fb-btn--secondary {
        min-height: 60px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes reveal-card {
      from { opacity: 0; transform: translateY(14px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>

      ];

      let lastBurst = 0;

      const rand = (min, max) => Math.random() * (max - min) + min;
      const pick = (array) => array[Math.floor(Math.random() * array.length)];

      const burst = () => {
        if (reducedMotion.matches) return;

        const now = performance.now();
        if (now - lastBurst < 320) return;
        lastBurst = now;

        const amount = window.innerWidth <= 560 ? 8 : 12;

        for (let i = 0; i < amount; i++) {
          const img = document.createElement('img');
          img.className = 'reaction';
          img.src = pick(REACTIONS);
          img.alt = '';

          const angle = rand(-162, -18) * Math.PI / 180;
          const distance = rand(92, window.innerWidth <= 560 ? 165 : 225);

          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance - rand(12, 62);

          img.style.setProperty('--tx', `${tx.toFixed(1)}px`);
          img.style.setProperty('--ty', `${ty.toFixed(1)}px`);
          img.style.setProperty('--rot', `${rand(-28, 28).toFixed(1)}deg`);
          img.style.setProperty('--scale', rand(.82, 1.18).toFixed(2));
          img.style.setProperty('--size', `${rand(32, 50).toFixed(0)}px`);
          img.style.setProperty('--dur', `${rand(820, 1180).toFixed(0)}ms`);
          img.style.setProperty('--delay', `${rand(0, 110).toFixed(0)}ms`);

          layer.appendChild(img);
          img.addEventListener('animationend', () => img.remove(), { once: true });
        }
      };

      if (finePointer.matches) {
        primary.addEventListener('mouseenter', burst);
        primary.addEventListener('focus', burst);
      }

      primary.addEventListener('pointerdown', burst);
    })();
