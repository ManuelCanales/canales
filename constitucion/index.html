        <form class="search-panel" id="searchForm" role="search">
          <label for="searchInput">Buscar término, artículo o tema</label>
          <div class="search-row">
            <input
              id="searchInput"
              type="search"
              placeholder="Ejemplo: propiedad, educación, habeas corpus, artículo 70..."
              autocomplete="off"
            />
            <button type="submit"><i class="bi bi-search"></i> Buscar</button>
          </div>
          <div class="filters" aria-label="Filtros de búsqueda">
            <button class="filter-btn active" type="button" data-filter="todos">
              Todo
            </button>
            <button class="filter-btn" type="button" data-filter="articulo">
              Artículos
            </button>
            <button class="filter-btn" type="button" data-filter="disposicion">
              Disposiciones
            </button>
            <button class="filter-btn" type="button" data-filter="preámbulo">
              Preámbulo
            </button>
          </div>
        </form>
      </section>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="Índice de artículos">
        <div class="sidebar-head">
          <h2>Índice</h2>
          <span id="articleCount">0 artículos</span>
        </div>
        <input
          id="articleJump"
          class="article-jump"
          type="search"
          placeholder="Ir a artículo 70..."
        />
        <div id="indexList" class="index-list"></div>
      </aside>

      <section class="content-area" aria-live="polite">
        <div class="stats-grid">
          <article class="stat-card">
            <strong id="totalItems">0</strong>
            <span>entradas</span>
          </article>
          <article class="stat-card">
            <strong id="totalArticles">0</strong>
            <span>artículos</span>
          </article>
          <article class="stat-card">
            <strong id="resultCount">0</strong>
            <span>resultados</span>
          </article>
        </div>

        <div class="results-head">
          <div>
            <h2 id="resultsTitle">Contenido completo</h2>
            <p id="resultsSubtitle">
              Escribe un término o elige un artículo del índice.
            </p>
          </div>
          <button class="secondary-btn" id="clearSearch" type="button">
            Limpiar
          </button>
        </div>

        <div id="results" class="results"></div>
      </section>
    </main>
