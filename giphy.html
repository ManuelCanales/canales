    <style>
      :root {
        --bg: #050505;
        --bg-2: #0a0a0a;
        --panel: rgba(14, 14, 14, 0.72);
        --panel-2: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.08);
        --muted: rgba(255, 255, 255, 0.68);
        --muted-2: rgba(255, 255, 255, 0.44);
        --text: #ffffff;
        --g1: #00ff99;
        --g2: #00ccff;
        --g3: #9933ff;
        --g4: #ff00cc;
        --g5: #ffff66;
        --radius-xl: 34px;
        --radius-lg: 24px;
        --radius-md: 18px;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        --max: 1160px;
        --transition: 280ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background: 
          radial-gradient(circle at 18% 18%, rgba(0, 255, 153, 0.07), transparent 24%),
          radial-gradient(circle at 82% 20%, rgba(153, 51, 255, 0.08), transparent 24%),
          linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
        overflow-x: hidden;
        position: relative;
      }

      a {
        color: inherit;
      }

      
      
      .gy-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        isolation: isolate;
      }

      .gy-pattern {
        position: absolute;
        inset: -10vh -10vw;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(32px, 6vw, 92px) clamp(26px, 5vw, 82px);
        align-content: space-evenly;
        justify-items: center;
        mix-blend-mode: screen;
      }

      .gy-pattern-a {
        opacity: 0.07;
        filter: blur(16px);
        transform: rotate(-14deg) scale(1.08);
        animation: gyPatternDriftA 28s ease-in-out infinite alternate;
      }

      .gy-pattern-b {
        opacity: 0.045;
        filter: blur(22px);
        transform: rotate(-10deg) translate3d(6vw, 7vh, 0) scale(1.03);
        animation: gyPatternDriftB 34s ease-in-out infinite alternate;
      }

      .gy-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .gy-mark .gy-wordmark,
      .gy-mark .gy-separator,
      .gy-mark .gy-canales-logo {
        display: none !important;
      }

      .gy-mark .gy-logo,
      .gy-mark .gy-giphy-logo,
      .gy-mark .gy-instagram-logo,
      .gy-mark .gy-tiktok-logo,
      .gy-mark img,
      .gy-mark svg {
        display: block;
        width: clamp(92px, 10vw, 150px) !important;
        height: auto !important;
        max-width: none;
        object-fit: contain;
        color: rgba(255, 255, 255, 0.72);
      }

      @keyframes gyPatternDriftA {
        0% { transform: rotate(-14deg) translate3d(0, 0, 0) scale(1.08); }
        100% { transform: rotate(-11deg) translate3d(2vw, -1.6vh, 0) scale(1.11); }
      }

      @keyframes gyPatternDriftB {
        0% { transform: rotate(-10deg) translate3d(6vw, 7vh, 0) scale(1.03); }
        100% { transform: rotate(-14deg) translate3d(4vw, 9vh, 0) scale(1.06); }
      }

      @media (max-width: 900px) {
        .gy-pattern {
          inset: -6vh -16vw;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: clamp(24px, 8vw, 58px) clamp(18px, 7vw, 42px);
        }
        .gy-pattern-a { opacity: 0.06; filter: blur(14px); }
        .gy-pattern-b { opacity: 0.04; filter: blur(18px); }
        .gy-mark .gy-logo,
        .gy-mark .gy-giphy-logo,
        .gy-mark .gy-instagram-logo,
        .gy-mark .gy-tiktok-logo,
        .gy-mark img,
        .gy-mark svg { width: clamp(80px, 18vw, 120px) !important; }
      }

      @media (max-width: 520px) {
        .gy-pattern {
          inset: -3vh -22vw;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 30px 20px;
        }
        .gy-pattern-a { opacity: 0.055; filter: blur(12px); }
        .gy-pattern-b { opacity: 0.035; filter: blur(16px); }
        .gy-mark .gy-logo,
        .gy-mark .gy-giphy-logo,
        .gy-mark .gy-instagram-logo,
        .gy-mark .gy-tiktok-logo,
        .gy-mark img,
        .gy-mark svg { width: 88px !important; }
      }

      @media (prefers-reduced-motion: reduce) {
        .gy-pattern-a,
        .gy-pattern-b { animation: none !important; }
      }

      @keyframes floatOne {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(70px, 40px, 0) scale(1.08); }
      }

      @keyframes floatTwo {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(-70px, 46px, 0) scale(1.08); }
      }

      @keyframes floatThree {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(28px, -34px, 0) scale(1.08); }
      }

      .gy-shell {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: var(--max);
        min-height: 100vh;
        margin: 0 auto;
        padding: 34px 20px;
        display: flex;
        align-items: center;
      }

      .gy-layout {
        width: 100%;
        display: grid;
        grid-template-columns: 1.08fr 0.92fr;
        gap: 28px;
        align-items: center;
      }

      .gy-left {
        padding-right: 8px;
      }

      .gy-lockup {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: nowrap;
        min-height: 54px;
        padding: 0 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        margin-bottom: 26px;
      }

      .gy-giphy-logo,
      .gy-canales-logo {
        display: block;
        width: auto;
        height: 22px;
        flex: 0 0 auto;
      }

      .gy-separator {
        font-size: 0.92rem;
        font-weight: 900;
        color: rgba(255, 255, 255, 0.72);
        line-height: 1;
        flex: 0 0 auto;
      }

      .gy-name {
        margin: 0 0 10px;
        font-size: clamp(1.1rem, 1.9vw, 1.5rem);
        line-height: 1.15;
        letter-spacing: -0.03em;
        font-weight: 800;
      }

      .gy-username-wrap {
        width: 100%;
        max-width: 760px;
        overflow: hidden;
        margin-bottom: 14px;
      }

      .gy-username {
        margin: 0;
        display: block;
        width: 100%;
        line-height: 0.92;
        letter-spacing: -0.08em;
        font-weight: 900;
        white-space: nowrap;
        font-size: 108px;
      }

      .gy-copy {
        margin: 0;
        max-width: 620px;
        font-size: 1.02rem;
        line-height: 1.72;
        color: var(--muted);
      }

      .gy-right-card {
        border-radius: var(--radius-xl);
        padding: 24px;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02)),
          rgba(12, 12, 12, 0.72);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .gy-stats {
        display: grid;
        gap: 12px;
        margin-bottom: 18px;
      }

      .gy-stat {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 18px 18px;
        border-radius: var(--radius-lg);
        background:
          linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01)),
          var(--panel-2);
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: transform var(--transition), border-color var(--transition);
      }

      .gy-stat:hover {
        transform: translateY(-2px);
        border-color: rgba(255,255,255,0.1);
      }

      .gy-stat-label {
        display: block;
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted-2);
        margin-bottom: 6px;
      }

      .gy-stat-value {
        display: block;
        font-size: clamp(1.25rem, 2.4vw, 1.6rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
        font-weight: 900;
      }

      .gy-stat-accent {
        width: 10px;
        height: 44px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--g1), var(--g2), var(--g3), var(--g4));
        opacity: 0.95;
      }

      .gy-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 64px;
        padding: 16px 22px;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, var(--g1) 0%, var(--g2) 30%, var(--g3) 65%, var(--g4) 100%);
        color: #fff;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 900;
        box-shadow: 0 16px 34px rgba(153, 51, 255, 0.22);
        transition: transform var(--transition), filter var(--transition), box-shadow var(--transition);
      }

      .gy-cta:hover {
        transform: translateY(-2px);
        filter: brightness(1.04);
        box-shadow: 0 20px 40px rgba(153, 51, 255, 0.3);
      }

      .gy-note {
        margin-top: 12px;
        text-align: center;
        font-size: 0.83rem;
        color: var(--muted-2);
      }

    <script>
      const usernameEl = document.getElementById("gyUsername");
      const handleInlineEl = document.getElementById("gyHandleInline");
      const ctaEl = document.getElementById("gyCta");

      function normalizeHandle(text) {
        return text.trim().replace(/^@+/, "");
      }

      function getBaseFontSize(len, compact) {
        const desktopRules = [
          { max: 8, size: 108 },
          { max: 10, size: 94 },
          { max: 12, size: 82 },
          { max: 14, size: 72 },
          { max: 16, size: 64 },
          { max: 18, size: 58 },
          { max: 99, size: 52 }
        ];

        const mobileRules = [
          { max: 8, size: 52 },
          { max: 10, size: 46 },
          { max: 12, size: 40 },
          { max: 14, size: 35 },
          { max: 16, size: 31 },
          { max: 18, size: 28 },
          { max: 99, size: 26 }
        ];

        const rules = compact ? mobileRules : desktopRules;
        return rules.find(rule => len <= rule.max).size;
      }

      function fitUsernameToWidth() {
        if (!usernameEl) return;

        const wrap = usernameEl.parentElement;
        if (!wrap) return;

        const rawText = usernameEl.textContent.trim();
        const compact = window.innerWidth <= 900;
        let size = getBaseFontSize(rawText.length, compact);
        const min = compact ? 24 : 40;
        const available = Math.max(0, wrap.clientWidth - 2);

        usernameEl.style.fontSize = size + "px";
        usernameEl.style.maxWidth = "100%";
        usernameEl.style.whiteSpace = "nowrap";

        while (usernameEl.scrollWidth > available && size > min) {
          size -= 1;
          usernameEl.style.fontSize = size + "px";
        }
      }

      function syncProfileData() {
        if (!usernameEl || !ctaEl) return;

        const rawText = usernameEl.textContent.trim();
        const handle = normalizeHandle(rawText);

        if (handleInlineEl) {
          handleInlineEl.textContent = handle;
        }

        ctaEl.href = "https://giphy.com/" + handle;
        fitUsernameToWidth();
      }

      syncProfileData();
      window.addEventListener("resize", () => window.requestAnimationFrame(syncProfileData));

      if (usernameEl) {
        const observer = new MutationObserver(() => window.requestAnimationFrame(syncProfileData));
        observer.observe(usernameEl, {
          childList: true,
          characterData: true,
          subtree: true
        });
      }
    </script>
