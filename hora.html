<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relojes del mundo</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 20px;
        }
        .logo {
            margin-bottom: 20px;
        }
        .clock-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .clock {
            border: 2px solid #007BFF;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 200px;
            transition: background-color 0.5s, color 0.5s;
        }
        .clock.day {
            background-color: #ffffff;
            color: #333;
        }
        .clock.night {
            background-color: #000000;
            color: #ffffff;
        }
        .clock .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .clock h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: inherit;
        }
        .clock img {
            width: 30px;
            height: auto;
            border-radius: 3px;
            border: 2px solid #000;
        }
        .clock p {
            margin: 10px 0 0;
            font-size: 18px;
            font-weight: 400;
            color: inherit;
        }
    </style>
</head>
<body>
    <img src="https://cdn.mcq.cl/logo/canales.svg" alt="Logo Canales" class="logo" style="width: 150px;">
    <h1>Relojes del Mundo</h1>
    <div class="clock-container" id="clockContainer">
        <!-- Relojes dinámicos aquí -->
    </div>

    <script>
        const cities = [
            { name: "Lima", timeZone: "America/Lima", flag: "pe" },
            { name: "Santiago de Chile", timeZone: "America/Santiago", flag: "cl" },
            { name: "Rapa Nui", timeZone: "Pacific/Easter", flag: "cl" },
            { name: "Madrid", timeZone: "Europe/Madrid", flag: "es" },
            { name: "Tokio", timeZone: "Asia/Tokyo", flag: "jp" },
            { name: "Nueva York", timeZone: "America/New_York", flag: "us" },
            { name: "Sydney", timeZone: "Australia/Sydney", flag: "au" },
            { name: "Caracas", timeZone: "America/Caracas", flag: "ve" },
            { name: "Bogotá", timeZone: "America/Bogota", flag: "co" },
            { name: "CDMX", timeZone: "America/Mexico_City", flag: "mx" },
            { name: "Miami", timeZone: "America/New_York", flag: "us" },
            { name: "Temuco", timeZone: "America/Santiago", flag: "cl" },
            { name: "Sao Paulo", timeZone: "America/Sao_Paulo", flag: "br" },
            { name: "Roma", timeZone: "Europe/Rome", flag: "it" },
            { name: "Paris", timeZone: "Europe/Paris", flag: "fr" },
            { name: "Panamá", timeZone: "America/Panama", flag: "pa" },
            { name: "Moscú", timeZone: "Europe/Moscow", flag: "ru" },
            { name: "Estambul", timeZone: "Europe/Istanbul", flag: "tr" },
            { name: "Quito", timeZone: "America/Guayaquil", flag: "ec" },
            { name: "Montevideo", timeZone: "America/Montevideo", flag: "uy" },
            { name: "Asunción", timeZone: "America/Asuncion", flag: "py" },
            { name: "Newark", timeZone: "America/New_York", flag: "us" },
            { name: "Arizona", timeZone: "America/Phoenix", flag: "us" },
            { name: "Barcelona", timeZone: "Europe/Madrid", flag: "es" },
            { name: "Arequipa", timeZone: "America/Lima", flag: "pe" },
            { name: "Pekín", timeZone: "Asia/Shanghai", flag: "cn" },
            { name: "Guadalajara", timeZone: "America/Mexico_City", flag: "mx" },
            { name: "Monterrey", timeZone: "America/Monterrey", flag: "mx" },
            { name: "Auckland", timeZone: "Pacific/Auckland", flag: "nz" },
            { name: "Seúl", timeZone: "Asia/Seoul", flag: "kr" },
            { name: "Pyongyang", timeZone: "Asia/Pyongyang", flag: "kp" },
            { name: "Shanghái", timeZone: "Asia/Shanghai", flag: "cn" },
            { name: "Milán", timeZone: "Europe/Rome", flag: "it" },
            { name: "Kiev", timeZone: "Europe/Kiev", flag: "ua" },
            { name: "Bagdad", timeZone: "Asia/Baghdad", flag: "iq" },
            { name: "Riad", timeZone: "Asia/Riyadh", flag: "sa" },
            { name: "Bruselas", timeZone: "Europe/Brussels", flag: "be" },
            { name: "San Petersburgo", timeZone: "Europe/Moscow", flag: "ru" },
            { name: "Buenos Aires", timeZone: "America/Argentina/Buenos_Aires", flag: "ar" },
            { name: "Sucre", timeZone: "America/La_Paz", flag: "bo" },
            { name: "Brasilia", timeZone: "America/Sao_Paulo", flag: "br" },
            { name: "Cusco", timeZone: "America/Lima", flag: "pe" },
            { name: "Bariloche", timeZone: "America/Argentina/Buenos_Aires", flag: "ar" },
            { name: "San Juan", timeZone: "America/Puerto_Rico", flag: "pr" },
            { name: "Ottawa", timeZone: "America/Toronto", flag: "ca" }
        ];

        const clockContainer = document.getElementById('clockContainer');

        // Crear relojes dinámicamente
        cities.forEach(city => {
            const clock = document.createElement('div');
            clock.className = 'clock';
            clock.setAttribute('id', city.name.replace(/ /g, "-"));
            clock.innerHTML = `
                <div class="header">
                    <img src="https://flagcdn.com/w40/${city.flag}.png" alt="Bandera de ${city.name}">
                    <h2>${city.name}</h2>
                </div>
                <p>00:00:00 AM</p>
            `;
            clockContainer.appendChild(clock);
        });

        // Actualizar los relojes en tiempo real con manejo de DST
        function updateClocks() {
            cities.forEach(city => {
                const localTime = new Date().toLocaleString('en-US', {
                    timeZone: city.timeZone,
                    hour12: true,
                    hour: 'numeric',
                    minute: 'numeric',
                    second: 'numeric'
                });

                const [time, period] = localTime.split(' ');
                const [hours, minutes, seconds] = time.split(':');

                const clockElement = document.getElementById(city.name.replace(/ /g, "-"));
                clockElement.querySelector('p').textContent = `${hours}:${minutes}:${seconds} ${period}`;

                const hour24 = (period === 'PM' && hours !== "12" ? parseInt(hours, 10) + 12 : parseInt(hours, 10));
                if (hour24 >= 6 && hour24 < 18) {
                    clockElement.classList.add('day');
                    clockElement.classList.remove('night');
                } else {
                    clockElement.classList.add('night');
                    clockElement.classList.remove('day');
                }
            });
        }

        // Actualizar cada segundo
        setInterval(updateClocks, 1000);
        updateClocks();
    </script>
</body>
</html>
