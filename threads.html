    <style>
      :root {
        --bg: #050505;
        --bg-2: #0a0a0a;
        --panel: rgba(14, 14, 14, 0.72);
        --panel-2: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.08);
        --muted: rgba(255, 255, 255, 0.68);
        --muted-2: rgba(255, 255, 255, 0.44);
        --text: #ffffff;
        --th1: #ffffff;
        --th2: rgba(255, 255, 255, 0.08);
        --th3: rgba(255, 255, 255, 0.04);
        --radius-xl: 34px;
        --radius-lg: 24px;
        --radius-md: 18px;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        --max: 1160px;
        --transition: 280ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 16% 18%, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 16%, transparent 42%),
          radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.07) 0%, transparent 28%),
          radial-gradient(circle at 68% 82%, rgba(255, 255, 255, 0.05) 0%, transparent 28%),
          linear-gradient(180deg, #101010 0%, #050505 100%);
        overflow-x: hidden;
        position: relative;
      }
      a {
        color: inherit;
      }

      .th-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        isolation: isolate;
      }

      .th-bg::before,
      .th-bg::after {
        content: "";
        position: absolute;
        inset: -8%;
        pointer-events: none;
      }

      .th-bg::before {
        background: radial-gradient(circle at 18% 24%, rgba(255, 255, 255, 0.1) 0%, transparent 34%), radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.08) 0%, transparent 28%), radial-gradient(circle at 64% 80%, rgba(255, 255, 255, 0.05) 0%, transparent 30%);
        filter: blur(36px);
        opacity: 0.92;
        animation: thGradientDriftA 18s ease-in-out infinite alternate;
      }

      .th-bg::after {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, transparent 42%, rgba(255, 255, 255, 0.02) 76%, transparent 100%);
        filter: blur(54px);
        opacity: 0.88;
        animation: thGradientDriftB 24s ease-in-out infinite alternate;
      }

      .th-watermark {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.12);
        mix-blend-mode: screen;
        will-change: transform, opacity, filter;
      }

      .th-watermark--a {
        top: 50%;
        left: 58%;
        width: clamp(340px, 54vw, 860px);
        transform: translate3d(-50%, -50%, 0) rotate(-12deg) scale(1);
        opacity: 0.075;
        filter: blur(14px);
        animation: thLogoFloatA 18s ease-in-out infinite alternate,
                   thLogoPulse 9s ease-in-out infinite;
      }

      .th-watermark--b {
        top: 16%;
        right: -4%;
        width: clamp(180px, 24vw, 360px);
        transform: rotate(-8deg) scale(0.96);
        opacity: 0.03;
        filter: blur(18px);
        animation: thLogoFloatB 22s ease-in-out infinite alternate,
                   thLogoPulse 11s ease-in-out infinite reverse;
      }

      .th-logo-wrap {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .th-logo-wrap .th-wordmark,
      .th-logo-wrap .th-separator,
      .th-logo-wrap .th-canales-logo {
        display: none !important;
      }

      .th-logo-wrap .th-logo,
      .th-logo-wrap .th-giphy-logo,
      .th-logo-wrap .th-instagram-logo,
      .th-logo-wrap .th-tiktok-logo,
      .th-logo-wrap img,
      .th-logo-wrap svg {
        display: block;
        width: 100% !important;
        height: auto !important;
        max-width: none;
        object-fit: contain;
        color: rgba(255, 255, 255, 0.12);
      }

      .th-bg .th-logo-wrap svg,
      .th-bg .th-logo-wrap img {
        opacity: 1;
      }

      .th-bg .th-logo-wrap path,
      .th-bg .th-logo-wrap rect,
      .th-bg .th-logo-wrap circle {
        vector-effect: non-scaling-stroke;
      }
      @keyframes thGradientDriftA {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(-2.2%, 2.8%, 0) scale(1.04); }
      }

      @keyframes thGradientDriftB {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(2.6%, -2.4%, 0) scale(1.06); }
      }

      @keyframes thLogoFloatA {
        0% { transform: translate3d(-50%, -50%, 0) rotate(-12deg) scale(1); }
        100% { transform: translate3d(-48%, -52%, 0) rotate(-8deg) scale(1.05); }
      }

      @keyframes thLogoFloatB {
        0% { transform: translate3d(0, 0, 0) rotate(-8deg) scale(0.96); }
        100% { transform: translate3d(-1.4vw, 2.2vh, 0) rotate(-12deg) scale(1.02); }
      }

      @keyframes thLogoPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.86; }
      }

      @media (max-width: 900px) {
        .th-watermark--a {
          left: 50%;
          width: clamp(280px, 68vw, 620px);
          opacity: 0.062;
          filter: blur(10px);
        }

        .th-watermark--b {
          top: 11%;
          right: auto;
          left: 74%;
          width: clamp(150px, 24vw, 240px);
          opacity: 0.026;
          filter: blur(13px);
        }
      }

      @media (max-width: 520px) {
        .th-watermark--a {
          left: 50%;
          top: 47%;
          width: min(92vw, 460px);
          opacity: 0.094;
          filter: blur(11px);
        }

        .th-watermark--b {
          top: 8%;
          left: 72%;
          width: min(40vw, 170px);
          opacity: 0.042;
          filter: blur(15px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .th-watermark--a,
        .th-watermark--b {
          animation: none !important;
        }

        .th-bg::before,
        .th-bg::after {
          animation: none !important;
        }
      }


      @keyframes floatOne {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        100% {
          transform: translate3d(70px, 40px, 0) scale(1.08);
        }
      }
      @keyframes floatTwo {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        100% {
          transform: translate3d(-70px, 46px, 0) scale(1.08);
        }
      }
      @keyframes floatThree {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        100% {
          transform: translate3d(28px, -34px, 0) scale(1.08);
        }
      }

    <script>
      const usernameEl = document.getElementById("thUsername");
      const handleInlineEl = document.getElementById("thHandleInline");
      const ctaEl = document.getElementById("thCta");

      function normalizeHandle(text) {
        return text.trim().replace(/^@+/, "");
      }

      function getBaseFontSize(len, compact) {
        const desktopRules = [
          { max: 8, size: 108 },
          { max: 10, size: 94 },
          { max: 12, size: 82 },
          { max: 14, size: 72 },
          { max: 16, size: 64 },
          { max: 18, size: 58 },
          { max: 99, size: 52 }
        ];

        const mobileRules = [
          { max: 8, size: 52 },
          { max: 10, size: 46 },
          { max: 12, size: 40 },
          { max: 14, size: 35 },
          { max: 16, size: 31 },
          { max: 18, size: 28 },
          { max: 99, size: 26 }
        ];

        const rules = compact ? mobileRules : desktopRules;
        return rules.find(rule => len <= rule.max).size;
      }

      function fitUsernameToWidth() {
        if (!usernameEl) return;

        const wrap = usernameEl.parentElement;
        if (!wrap) return;

        const rawText = usernameEl.textContent.trim();
        const compact = window.innerWidth <= 900;
        let size = getBaseFontSize(rawText.length, compact);
        const min = compact ? 24 : 40;
        const available = Math.max(0, wrap.clientWidth - 2);

        usernameEl.style.fontSize = size + "px";
        usernameEl.style.maxWidth = "100%";
        usernameEl.style.whiteSpace = "nowrap";

        while (usernameEl.scrollWidth > available && size > min) {
          size -= 1;
          usernameEl.style.fontSize = size + "px";
        }
      }

      function syncProfileData() {
        if (!usernameEl || !ctaEl) return;

        const rawText = usernameEl.textContent.trim();
        const handle = normalizeHandle(rawText);

        if (handleInlineEl) {
          handleInlineEl.textContent = handle;
        }

        ctaEl.href = "https://www.threads.com/@" + handle;
        fitUsernameToWidth();
      }

      syncProfileData();
      window.addEventListener("resize", () => window.requestAnimationFrame(syncProfileData));

      if (usernameEl) {
        const observer = new MutationObserver(() => window.requestAnimationFrame(syncProfileData));
        observer.observe(usernameEl, {
          childList: true,
          characterData: true,
          subtree: true
        });
      }
    </script>

  </body>
</html>
