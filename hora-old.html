    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 20px;
        }
        .logo {
            margin-bottom: 20px;
        }
        .clock-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .clock {
            border: 2px solid #007BFF;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 200px;
            transition: background-color 0.5s, color 0.5s;
        }
        .clock.day {
            background-color: #ffffff;
            color: #333;
        }
        .clock.night {
            background-color: #000000;
            color: #ffffff;
        }
        .clock .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .clock h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: inherit;
        }
        .clock img {
            width: 30px;
            height: auto;
            border-radius: 3px;
            border: 2px solid #000;
        }
        .clock p {
            margin: 10px 0 0;
            font-size: 18px;
            font-weight: 400;
            color: inherit;
        }
    </style>

<body>
    <img src="https://cdn.mcq.cl/logo/canales.svg" alt="Logo Canales" class="logo" style="width: 150px;">
    <h1>Relojes del Mundo</h1>
    <div class="clock-container" id="clockContainer">
        <!-- Relojes dinámicos aquí -->
    </div>

    <script>
        const cities = [
            { name: "Lima", offset: -5, flag: "pe" },
            { name: "Santiago de Chile", offset: -3, flag: "cl" },
            { name: "Caracas", offset: -4, flag: "ve" },
            { name: "CDMX", offset: -6, flag: "mx" },
            { name: "Bogotá", offset: -5, flag: "co" },
            { name: "Medellín", offset: -5, flag: "co" },
            { name: "Madrid", offset: 1, flag: "es" },
            { name: "Miami", offset: -5, flag: "us" },
            { name: "Temuco", offset: -3, flag: "cl" },
            { name: "Sao Paulo", offset: -3, flag: "br" },
            { name: "Roma", offset: 1, flag: "it" },
            { name: "Paris", offset: 1, flag: "fr" },
            { name: "Panamá", offset: -5, flag: "pa" },
            { name: "Moscú", offset: 3, flag: "ru" },
            { name: "Tokio", offset: 9, flag: "jp" },
            { name: "Estambul", offset: 3, flag: "tr" },
            { name: "Quito", offset: -5, flag: "ec" },
            { name: "Montevideo", offset: -3, flag: "uy" },
            { name: "Asunción", offset: -3, flag: "py" },
            { name: "Newark", offset: -5, flag: "us" },
            { name: "Arizona", offset: -7, flag: "us" },
            { name: "Barcelona", offset: 1, flag: "es" },
            { name: "Arequipa", offset: -5, flag: "pe" },
            { name: "Pekín", offset: 8, flag: "cn" },
            { name: "Guadalajara", offset: -6, flag: "mx" },
            { name: "Monterrey", offset: -6, flag: "mx" },
            { name: "Sydney", offset: 11, flag: "au" },
            { name: "Auckland", offset: 13, flag: "nz" },
            { name: "Seúl", offset: 9, flag: "kr" },
            { name: "Pyongyang", offset: 9, flag: "kp" },
            { name: "Shanghái", offset: 8, flag: "cn" },
            { name: "Milán", offset: 1, flag: "it" },
            { name: "Kiev", offset: 2, flag: "ua" },
            { name: "Bagdad", offset: 3, flag: "iq" },
            { name: "Riad", offset: 3, flag: "sa" },
            { name: "Bruselas", offset: 1, flag: "be" },
            { name: "San Petersburgo", offset: 3, flag: "ru" },
            { name: "Buenos Aires", offset: -3, flag: "ar" },
            { name: "Sucre", offset: -4, flag: "bo" },
            { name: "Brasilia", offset: -3, flag: "br" },
            { name: "Cusco", offset: -5, flag: "pe" },
            { name: "Rapa Nui", offset: -6, flag: "cl" },
            { name: "Bariloche", offset: -3, flag: "ar" },
            { name: "San Juan", offset: -4, flag: "pr" },
            { name: "Ottawa", offset: -5, flag: "ca" }
        ];

        const clockContainer = document.getElementById('clockContainer');

        // Crear relojes dinámicamente
        cities.forEach(city => {
            const clock = document.createElement('div');
            clock.className = 'clock';
            clock.setAttribute('id', city.name.replace(/ /g, "-"));
            clock.innerHTML = `
                <div class="header">
                    <img src="https://flagcdn.com/w40/${city.flag}.png" alt="Bandera de ${city.name}">
                    <h2>${city.name}</h2>
                </div>
                <p>00:00:00 AM</p>
            `;
            clockContainer.appendChild(clock);
        });

        // Actualizar los relojes en tiempo real
        function updateClocks() {
            cities.forEach(city => {
                const now = new Date();
                const utc = now.getTime() + now.getTimezoneOffset() * 60000;
                const localTime = new Date(utc + city.offset * 3600000);

                const hours = localTime.getHours();
                const minutes = localTime.getMinutes();
                const seconds = localTime.getSeconds();
                const ampm = hours >= 12 ? 'PM' : 'AM';

                const formattedHours = hours % 12 || 12; // Convertir 0 a 12 para AM/PM
                const formattedMinutes = minutes.toString().padStart(2, '0');
                const formattedSeconds = seconds.toString().padStart(2, '0');

                const timeString = `${formattedHours}:${formattedMinutes}:${formattedSeconds} ${ampm}`;
                const clockElement = document.getElementById(city.name.replace(/ /g, "-"));

                // Actualizar hora
                clockElement.querySelector('p').textContent = timeString;

                // Cambiar fondo según si es día o noche
                if (hours >= 6 && hours < 18) {
                    clockElement.classList.add('day');
                    clockElement.classList.remove('night');
                } else {
                    clockElement.classList.add('night');
                    clockElement.classList.remove('day');
                }
            });
        }

        // Actualizar cada segundo
        setInterval(updateClocks, 1000);

        // Inicializar los relojes
        updateClocks();
    </script>
</body>
