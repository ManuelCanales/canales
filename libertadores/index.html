      :root {
        --bg: #000;
        --txt: #f5e9e9;
        --title: #d33;
        --glass: rgba(255, 255, 255, 0.04);
        --stroke: rgba(255, 255, 255, 0.14);
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }

      body {
        background: var(--bg);
        color: var(--txt);
      }

      .etapas-wrap {
        max-width: 980px;
        position: relative;
        isolation: isolate;
      }

      /* halo superior sutil */
      .etapas-wrap::before {
        content: "";
        position: absolute;
        inset: -120px -40px auto -40px;
        height: 240px;
        background: radial-gradient(
          60% 50% at 50% 0%,
          rgba(255, 255, 255, 0.12),
          transparent 60%
        );
        pointer-events: none;
        filter: blur(22px);
      }

      .etapas-title {
        color: var(--title);
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      /* Carta base */
      .etapa-card {
        display: flex;
        align-items: center;
        justify-content: center;
        text-transform: uppercase;
        line-height: 1.35;
        font-weight: 700;
        font-size: 14px;
        padding: 18px 20px;
        border-radius: 14px;
        background: linear-gradient(
          180deg,
          var(--glass),
          rgba(255, 255, 255, 0.02)
        );
        /* borde con “brillo” */
        border: 1.5px solid var(--stroke);
        box-shadow: var(--shadow);
        position: relative;
        min-height: 96px;
      }

      /* anillo luminoso interior */
      .etapa-card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.06);
        pointer-events: none;
      }

      /* acento por etapa (borde + glow) */
      .etapa1 {
        --accent: #b12f16;
      }
      .etapa2 {
        --accent: #704040;
      }
      .etapa3 {
        --accent: #b16716;
      }
      .etapa4 {
        --accent: #bc8217;
      }

      .etapa-card {
        color: var(--accent);
        border-color: color-mix(in srgb, var(--accent) 70%, #ffffff 5%);
      }
      .etapa-card:hover {
        transform: translateY(-2px);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        box-shadow: 0 10px 26px color-mix(in srgb, var(--accent) 35%, #000 70%);
      }

      /* “píxel” decorativo en la esquina (detalle pro) */
      .etapa-card::before {
        content: "";
        position: absolute;
        inset: auto 14px -8px auto;
        width: 36%;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        opacity: 0.55;
        pointer-events: none;
      }

      /* tipografía dentro */
      .etapa-card h5 {
        color: color-mix(in srgb, var(--accent) 92%, #ffffff 8%);
        letter-spacing: 0.3px;
      }

      /* espaciados en móvil más cómodos */
      @media (max-width: 576px) {
        .etapa-card {
          padding: 16px;
          border-radius: 12px;
          margin: 15px;
        }
      }

      /* ======= UTILIDADES ======= */
      const byYearAsc = (a, b) => a.year - b.year;

      /* 9 bloques contiguos para orden perfecto */
      function splitSequential(items, rowsCount = 9) {
        const n = items.length;
        const base = Math.floor(n / rowsCount);
        let rem = n % rowsCount;
        const rows = [];
        let idx = 0;
        for (let r = 0; r < rowsCount; r++) {
          const take = base + (rem > 0 ? 1 : 0);
          rem = Math.max(0, rem - 1);
          rows.push(items.slice(idx, idx + take));
          idx += take;
        }
        return rows;
      }

      /* Precarga de logos: <link rel="preload"> + decode() */
      const logoCache = new Map();
      function preloadLogos(keys) {
        // inyecta link preload
        const head = document.head;
        keys.forEach((k) => {
          const href = logos[k];
          if (!href) return;
          const link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = href;
          head.appendChild(link);
        });
        // carga real a memoria
        const promises = keys.map((k) => {
          return new Promise((resolve) => {
            const src = logos[k];
            if (!src) {
              resolve({ key: k, ok: false });
              return;
            }
            const img = new Image();
            img.decoding = "async";
            img.onload = async () => {
              try {
                await img.decode?.();
              } catch {}
              logoCache.set(k, src);
              resolve({ key: k, ok: true });
            };
            img.onerror = () => {
              resolve({ key: k, ok: false });
            }; // si falla, igual seguimos
            img.src = src;
          });
        });
        return Promise.all(promises);
      }

      /* Crea una chapita */
      function plateNode({ year, team, country, logoKey }) {
        const p = document.createElement("div");
        p.className = "plate";
        const src = logoCache.get(logoKey);
        const hasLogo = Boolean(src);
        p.classList.toggle("no-logo", !hasLogo);
        p.innerHTML = `
    <span class="r-bot"></span>
    <div class="inner">
      <div class="logoBox">${
        hasLogo ? `<img class="logo" src="${src}" alt="${team}">` : ""
      }</div>
      <div class="txt">
        <div class="year">${year}</div>
        <div class="team">${team}</div>
        <div class="country">${country}</div>
      </div>
    </div>
  `;
        return p;
      }

      /* Duplica cada carril para loop continuo y ajusta velocidad según ancho real */
      function buildLane(rowItems, laneEl, direction) {
        laneEl.className = "lane " + (direction === "l" ? "dir-l" : "dir-r");
        const track = document.createElement("div");
        track.className = "track";

        const unit = document.createElement("div");
        unit.style.display = "flex";
        unit.style.gap = "var(--gap-x)";
        rowItems.forEach((item) => unit.appendChild(plateNode(item)));

        const unit2 = unit.cloneNode(true);
        track.appendChild(unit);
        track.appendChild(unit2);
        laneEl.appendChild(track);

        requestAnimationFrame(() => {
          const unitW = unit.getBoundingClientRect().width;
          const pxPerSec = 60;
          const duration = Math.max(14, unitW / pxPerSec);
          track.style.animationDuration = `${duration}s`;
        });
      }

      /* ======= RENDER ======= */
      const rowsWrap = document.getElementById("rows");
      const loading = document.getElementById("loading");

      (async function init() {
        const sorted = [...champions].sort(byYearAsc);
        const logoKeys = Array.from(
          new Set(sorted.map((c) => c.logoKey).filter(Boolean))
        );
        await preloadLogos(logoKeys); // esperamos a que estén listos
        const rows = splitSequential(sorted, 9);

        rows.forEach((items, idx) => {
          const lane = document.createElement("div");
          const dir = idx % 2 === 0 ? "l" : "r";
          buildLane(items, lane, dir);
          rowsWrap.appendChild(lane);
        });

        loading.remove();
        rowsWrap.hidden = false;
      })();
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Función que actualiza el botón según el valor del href
        function updateButton(buttonLink) {
          const parentButton =
            buttonLink.closest(".match-bet-placeoff.btn") ||
            buttonLink.closest(".match-bet-place.btn");
          if (buttonLink.getAttribute("href") === "#0") {
            buttonLink.textContent = "No disponible";
            if (parentButton) {
              parentButton.classList.remove("match-bet-place");
              parentButton.classList.add("match-bet-placeoff");
            }
          } else {
            buttonLink.textContent = "Más información";
            if (parentButton) {
              parentButton.classList.remove("match-bet-placeoff");
              parentButton.classList.add("match-bet-place");
            }
          }
        }

        // Función que observa cambios en el href del enlace
        function observeHrefChanges(buttonLink) {
          const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
              if (
                mutation.type === "attributes" &&
                mutation.attributeName === "href"
              ) {
                updateButton(buttonLink);
              }
            });
          });

          // Inicia la observación de cambios en el atributo href
          observer.observe(buttonLink, { attributes: true });

          // Chequeo inicial del href
          updateButton(buttonLink);
        }

        // Observa el DOM por cambios que agreguen botones dinámicamente
        const dynamicObserver = new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            const addedNodes = mutation.addedNodes;
            addedNodes.forEach(function (node) {
              if (
                node.nodeType === 1 &&
                node.matches(".match-bet-placeoff.btn, .match-bet-place.btn")
              ) {
                const buttonLink = node.querySelector("a");
                if (buttonLink) {
                  observeHrefChanges(buttonLink);
                }
              }
            });
          });
        });

        // Observa el body por cambios en el DOM
        dynamicObserver.observe(document.body, {
          childList: true,
          subtree: true,
        });

        // Si ya hay botones en el DOM al cargar la página, los procesa
        document
          .querySelectorAll(".match-bet-placeoff.btn a, .match-bet-place.btn a")
          .forEach(function (buttonLink) {
            observeHrefChanges(buttonLink);
          });
      });
    </script>
