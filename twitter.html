  <style>
    :root {
      --twitter-blue: #1DA1F2;
      --twitter-blue-hover: #198FD9;
      --twitter-black: #14171A;
      --twitter-dark-gray: #657786;
      --twitter-light-gray: #AAB8C2;
      --twitter-extra-light-gray: #E1E8ED;
      --twitter-extra-extra-light-gray: #F5F8FA;
      --white: #FFFFFF;
      --max: 1160px;
      --ease: cubic-bezier(.2,.8,.2,1);
      --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-width: 0;
      min-height: 100svh;
      overflow-x: hidden;
      background: var(--white);
      color: var(--twitter-black);
      font-family: var(--font);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================================
       REGIONALIZACIÓN SIN PARTIR EL FONDO
       ========================================================= */
    .tw-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--white);
      pointer-events: none;
    }

    .tw-half {
      display: none;
    }

    .tw-stage::before {
      content: "";
      position: absolute;
      top: clamp(46px, 8vh, 86px);
      bottom: clamp(46px, 8vh, 86px);
      left: 50%;
      width: 1px;
      background: var(--twitter-extra-light-gray);
      transform: translateX(-.5px);
    }

    .tw-stage::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 58px;
      border-radius: 999px;
      background: var(--twitter-blue);
      transform: translate(-1.5px, -50%);
      opacity: .88;
      transition:
        height .35s var(--ease),
        opacity .35s var(--ease);
    }

    body[data-twitter-focus="true"] .tw-stage::after {
      height: 104px;
      opacity: 1;
    }

    .tw-shell {
      position: relative;
      z-index: 2;
      width: min(100%, var(--max));
      min-height: 100svh;
      margin: 0 auto;
      padding:
        max(28px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
    }

    .tw-layout {
      width: 100%;
      min-height: calc(100svh - 56px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
      gap: clamp(28px, 5vw, 64px);
      align-items: center;
    }

    .tw-left {
      position: relative;
      min-width: 0;
      height: 100%;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      color: var(--twitter-blue);
      padding-bottom: 78px;
      animation: reveal .7s .06s both;
    }

    .tw-lockup {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      max-width: 100%;
      margin: 0;
    }

    .tw-logo {
      display: block;
      width: 52px;
      height: 52px;
      object-fit: contain;
      flex: 0 0 auto;
      filter:
        brightness(0)
        saturate(100%)
        invert(53%)
        sepia(94%)
        saturate(1923%)
        hue-rotate(176deg)
        brightness(98%)
        contrast(94%);
    }

    .tw-lockup-handle {
      max-width: 100%;
      white-space: nowrap;
      color: var(--twitter-blue);
      font-size: clamp(1.95rem, 3.55vw, 3.15rem);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.04em;
    }

    .tw-canales {
      position: absolute;
      left: 0;
      bottom: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      opacity: .92;
    }

    .tw-canales img {
      display: block;
      width: auto;
      height: 34px;
      max-width: min(240px, 58vw);
      filter: brightness(0);
    }

    .tw-right {
      min-width: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .tw-actions {
      position: relative;
      width: 100%;
      max-width: 420px;
      display: grid;
      gap: 14px;
      animation: reveal-card .8s .18s both;
    }

    .tw-btn {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 72px;
      padding: 20px 42px;
      border: 0;
      border-radius: 999px;
      text-align: center;
      font-size: 1rem;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -.018em;
      transition:
        transform .34s var(--ease),
        box-shadow .34s var(--ease),
        background-color .28s ease,
        color .28s ease;
    }

    .tw-btn .label {
      position: relative;
      z-index: 4;
    }

    .tw-btn--primary {
      color: var(--white);
      background: var(--twitter-blue);
      box-shadow: 0 12px 28px rgba(29,161,242,.16);
      overflow: visible;
    }

    .tw-btn--secondary {
      min-height: 64px;
      color: var(--twitter-dark-gray);
      background: var(--white);
      box-shadow: inset 0 0 0 1px var(--twitter-extra-light-gray);
    }

    .tw-bird-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: visible;
      pointer-events: none;
    }

    .tw-bird {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--size, 22px);
      height: var(--size, 22px);
      opacity: 0;
      transform:
        translate(-50%, -50%)
        translate3d(0,0,0)
        scale(.72)
        rotate(var(--rot-start, 0deg));
      filter: drop-shadow(0 6px 12px rgba(20,23,26,.10));
      animation: bird-burst var(--dur, 900ms) cubic-bezier(.16,.72,.18,1) var(--delay,0ms) forwards;
    }

    .tw-bird img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes bird-burst {
      0% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          translate3d(0,0,0)
          scale(.7)
          rotate(var(--rot-start, 0deg));
      }

      14% { opacity: .98; }
      68% { opacity: .86; }

      100% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          translate3d(var(--tx), var(--ty), 0)
          scale(var(--scale,1))
          rotate(var(--rot-end, 0deg));
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .tw-btn--primary:hover,
      .tw-btn--primary:focus-visible {
        transform: translateY(-3px);
        background: var(--twitter-blue-hover);
        box-shadow: 0 18px 38px rgba(29,161,242,.20);
      }

      .tw-btn--secondary:hover,
      .tw-btn--secondary:focus-visible {
        transform: translateY(-2px);
        background: var(--twitter-extra-extra-light-gray);
        box-shadow: inset 0 0 0 1px var(--twitter-light-gray);
      }
    }

    .tw-btn:active { transform: translateY(0) scale(.985) !important; }

    .tw-btn:focus-visible {
      outline: 3px solid rgba(29,161,242,.24);
      outline-offset: 4px;
    }

    .tw-legal {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 3;
      max-width: min(42vw, 460px);
      margin: 0;
      color: var(--twitter-light-gray);
      font-size: 9px;
      line-height: 1.35;
      text-align: right;
      opacity: .72;
    }

    @media (max-width: 900px) {
      body {
        background: var(--white);
      }

      .tw-stage {
        display: block;
        background: var(--white);
      }

      .tw-stage::before {
        top: 50%;
        bottom: auto;
        left: max(28px, env(safe-area-inset-left));
        right: max(28px, env(safe-area-inset-right));
        width: auto;
        height: 1px;
        background: var(--twitter-extra-light-gray);
        transform: translateY(-.5px);
      }

      .tw-stage::after {
        left: 50%;
        top: 50%;
        width: 58px;
        height: 3px;
        transform: translate(-50%, -1.5px);
      }

      body[data-twitter-focus="true"] .tw-stage::after {
        width: 104px;
        height: 3px;
      }

      .tw-shell {
        min-height: 100svh;
        align-items: center;
        padding:
          max(28px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          max(28px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
      }

      .tw-layout {
        width: 100%;
        min-height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        gap: clamp(28px, 7vh, 48px);
        align-items: center;
      }

      .tw-left,
      .tw-right {
        width: 100%;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .tw-left {
        position: static;
        height: auto;
        min-height: auto;
        padding: 0;
        color: var(--twitter-blue);
      }

      .tw-lockup {
        justify-content: center;
        gap: 14px;
        margin: 0;
      }

      /* El SVG principal es blanco en desktop.
         En mobile lo convertimos al azul Twitter. */
      .tw-logo {
        width: 48px;
        height: 48px;
        filter:
          brightness(0)
          saturate(100%)
          invert(53%)
          sepia(94%)
          saturate(1923%)
          hue-rotate(176deg)
          brightness(98%)
          contrast(94%);
      }

      .tw-lockup-handle {
        max-width: calc(100vw - 96px);
        color: var(--twitter-blue);
        font-size: clamp(1.7rem, 7.2vw, 2.55rem);
        line-height: 1;
        letter-spacing: -.04em;
        overflow: hidden;
        text-overflow: clip;
      }

      .tw-canales {
        position: static;
        left: auto;
        bottom: auto;
        margin-top: 22px;
        justify-content: center;
        opacity: .88;
      }

      .tw-canales img {
        height: 30px;
        max-width: min(190px, 52vw);
      }

      .tw-right {
        padding: 0;
      }

      .tw-actions {
        width: min(100%, 440px);
        max-width: 440px;
        gap: 13px;
      }

      .tw-btn {
        min-height: 64px;
        padding: 18px 28px;
      }

      .tw-btn--secondary {
        min-height: 58px;
      }

      .tw-legal {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        right: max(16px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
        max-width: none;
        margin: 0;
        text-align: center;
        font-size: 8px;
        line-height: 1.35;
        color: var(--twitter-light-gray);
        opacity: .62;
      }
    }

    @media (max-width: 560px) {
      .tw-shell {
        padding-left: max(14px, env(safe-area-inset-left));
        padding-right: max(14px, env(safe-area-inset-right));
      }

      .tw-layout {
        gap: 28px;
      }

      .tw-lockup {
        gap: 10px;
      }

      .tw-logo {
        width: 40px;
        height: 40px;
      }

      .tw-lockup-handle {
        max-width: calc(100vw - 76px);
        font-size: clamp(1.42rem, 7.1vw, 2rem);
      }

      .tw-canales {
        margin-top: 18px;
      }

      .tw-canales img {
        height: 25px;
        max-width: 155px;
      }

      .tw-actions {
        gap: 11px;
      }

      .tw-btn {
        min-height: 60px;
        padding: 16px 20px;
        font-size: .96rem;
      }

      .tw-btn--secondary {
        min-height: 56px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes reveal-card {
      from { opacity: 0; transform: translateY(14px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* =========================================================
       ?brand=x — X BRAND MODE
       ========================================================= */
    html[data-brand="x"] {
      --twitter-blue: #000000;
      --twitter-blue-hover: #1A1A1A;
      --twitter-black: #000000;
      --twitter-dark-gray: #536471;
      --twitter-light-gray: #8B98A5;
      --twitter-extra-light-gray: #EFF3F4;
      --twitter-extra-extra-light-gray: #F7F9F9;
    }

    .tw-logo--x {
      display: none;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      color: #000;
    }

    html[data-brand="x"] .tw-logo--twitter {
      display: none;
    }

    html[data-brand="x"] .tw-logo--x {
      display: block;
    }

    html[data-brand="x"] .tw-logo {
      filter: none;
    }

    html[data-brand="x"] .tw-lockup-handle {
      color: #000;
    }

    html[data-brand="x"] .tw-stage::after {
      background: #000;
    }

    html[data-brand="x"] .tw-btn--primary {
      background: #000;
      color: #fff;
      box-shadow: 0 12px 28px rgba(0,0,0,.12);
    }

    @media (hover: hover) and (pointer: fine) {
      html[data-brand="x"] .tw-btn--primary:hover,
      html[data-brand="x"] .tw-btn--primary:focus-visible {
        background: #1A1A1A;
        box-shadow: 0 18px 38px rgba(0,0,0,.16);
      }
    }

    html[data-brand="x"] .tw-bird {
      filter: drop-shadow(0 6px 12px rgba(0,0,0,.08));
    }

    @media (max-width: 900px) {
      html[data-brand="x"] .tw-logo--x {
        width: 42px;
        height: 42px;
      }

      html[data-brand="x"] .tw-lockup-handle {
        color: #000;
      }
    }

    @media (max-width: 560px) {
      html[data-brand="x"] .tw-logo--x {
        width: 36px;
        height: 36px;
      }
    }


    /* =========================================================
       BRAND SWITCH BANNER
       ========================================================= */
    .brand-switch {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: min(360px, calc(100vw - 36px));
      padding: 10px 14px;
      border: 1px solid var(--twitter-extra-light-gray);
      border-radius: 999px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 10px 28px rgba(20,23,26,.08);
      color: var(--twitter-dark-gray);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -.01em;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(-14px);
      animation: brand-switch-in .48s var(--ease) .65s forwards;
    }

    .brand-switch a {
      color: var(--twitter-blue);
      font-weight: 800;
      white-space: nowrap;
    }

    .brand-switch a:hover,
    .brand-switch a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    html[data-brand="x"] .brand-switch a {
      color: #000;
    }

    @keyframes brand-switch-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .brand-switch {
        top: max(12px, env(safe-area-inset-top));
        right: 50%;
        transform: translate(50%, -14px);
        max-width: calc(100vw - 28px);
        padding: 9px 13px;
        font-size: 11px;
        white-space: nowrap;
      }

      @keyframes brand-switch-in {
        to {
          opacity: 1;
          transform: translate(50%, 0);
        }
      }
    }

    @media (max-width: 420px) {
      .brand-switch {
        white-space: normal;
        text-align: center;
        justify-content: center;
      }
    }

  </style>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const isX = (params.get('brand') || '').toLowerCase() === 'x';
      const brandSwitchLink = document.getElementById('brandSwitchLink');

      if (brandSwitchLink) {
        const nextParams = new URLSearchParams(location.search);
        nextParams.set('brand', isX ? 'twitter' : 'x');

        const query = nextParams.toString();
        brandSwitchLink.href = query ? `?${query}${location.hash}` : `.${location.hash}`;
        brandSwitchLink.setAttribute(
          'aria-label',
          isX ? 'Cambiar al branding clásico de Twitter' : 'Cambiar al branding de X'
        );
      }

      const primary = document.getElementById('twPrimary');
      const layer = primary?.querySelector('.tw-bird-layer');
      const label = document.getElementById('brandPrimaryLabel');
      const legal = document.getElementById('brandLegal');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');

      const birdSrc = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><path fill='%231DA1F2' d='m 250,87.974 c -7.358,3.264 -15.267,5.469 -23.566,6.461 8.471,-5.078 14.978,-13.119 18.041,-22.701 -7.929,4.703 -16.71,8.117 -26.057,9.957 -7.484,-7.975 -18.148,-12.957 -29.95,-12.957 -22.66,0 -41.033,18.371 -41.033,41.031 0,3.216 0.363,6.348 1.062,9.351 -34.102,-1.711 -64.336,-18.047 -84.574,-42.872 -3.532,6.06 -5.556,13.108 -5.556,20.628 0,14.236 7.244,26.795 18.254,34.153 -6.726,-0.213 -13.053,-2.059 -18.585,-5.132 -0.004,0.171 -0.004,0.343 -0.004,0.516 0,19.88 14.144,36.464 32.915,40.234 -3.443,0.938 -7.068,1.439 -10.81,1.439 -2.644,0 -5.214,-0.258 -7.72,-0.736 5.222,16.301 20.375,28.165 38.331,28.495 -14.043,11.006 -31.735,17.565 -50.96,17.565 -3.312,0 -6.578,-0.194 -9.788,-0.574 18.159,11.643 39.727,18.437 62.899,18.437 75.473,0 116.746,-62.524 116.746,-116.747 0,-1.779 -0.04,-3.548 -0.119,-5.309 8.017,-5.784 14.973,-13.011 20.474,-21.239 z'/></svg>";
      const xSrc = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23000000' d='M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z'/></svg>";

      if (isX) {
        document.title = 'X | CANALES®';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#000000');

        if (primary) {
          primary.href = 'https://x.com/manuelcanales';
          primary.setAttribute('aria-label', 'Seguir a @manuelcanales en X');
        }

        if (label) label.textContent = 'Seguir en X';

        if (legal) {
          legal.textContent = 'X and the X logo are trademarks of X Corp.';
        }
      }

      if (!primary || !layer) return;

      let lastBurst = 0;

      const rand = (min, max) => Math.random() * (max - min) + min;

      const setFocus = (value) => {
        if (value) document.body.dataset.twitterFocus = 'true';
        else delete document.body.dataset.twitterFocus;
      };

      const burst = () => {
        if (reducedMotion.matches) return;

        const now = performance.now();
        if (now - lastBurst < 300) return;
        lastBurst = now;

        const amount = window.innerWidth <= 560 ? 8 : 12;

        for (let i = 0; i < amount; i++) {
          const item = document.createElement('span');
          item.className = 'tw-bird';

          const img = document.createElement('img');
          img.src = isX ? xSrc : birdSrc;
          img.alt = '';
          item.appendChild(img);

          const angle = rand(-170, -10) * Math.PI / 180;
          const distance = rand(76, window.innerWidth <= 560 ? 150 : 215);
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance - rand(6, 42);

          item.style.setProperty('--tx', `${tx.toFixed(1)}px`);
          item.style.setProperty('--ty', `${ty.toFixed(1)}px`);
          item.style.setProperty('--scale', rand(.88, 1.28).toFixed(2));
          item.style.setProperty('--size', `${rand(isX ? 14 : 16, isX ? 30 : 34).toFixed(0)}px`);
          item.style.setProperty('--dur', `${rand(760, 1080).toFixed(0)}ms`);
          item.style.setProperty('--delay', `${rand(0, 110).toFixed(0)}ms`);
          item.style.setProperty('--rot-start', `${rand(-14, 14).toFixed(1)}deg`);
          item.style.setProperty('--rot-end', `${rand(-34, 34).toFixed(1)}deg`);

          layer.appendChild(item);
          item.addEventListener('animationend', () => item.remove(), { once: true });
        }
      };

      if (finePointer.matches) {
        primary.addEventListener('mouseenter', () => {
          setFocus(true);
          burst();
        });

        primary.addEventListener('mouseleave', () => setFocus(false));

        primary.addEventListener('focus', () => {
          setFocus(true);
          burst();
        });

        primary.addEventListener('blur', () => setFocus(false));
      }

      primary.addEventListener('pointerdown', burst);
    })();
  </script>
