    <h1>Normativas y Políticas para Perfiles en Redes Sociales</h1>

    <p>Estimados usuarios:</p>

    <p>
      En calidad de administradores y gestores de los perfiles digitales en redes sociales (Facebook, Twitter, Instagram y/o similares)
      bajo la responsabilidad de <strong>CANALES®</strong>, nos dirigimos a ustedes para establecer de manera detallada las normativas,
      directrices y políticas que rigen la interacción y participación en nuestros espacios digitales, con fundamento en las disposiciones
      legales y con el propósito de fomentar un ambiente de respeto, integridad y colaboración entre todos los miembros de nuestra comunidad
      en línea.
    </p>

    <h2>Normas de Conducta y Contenido</h2>

    <ol>
      <li><strong>Respeto y Cortesía</strong>: Se espera que todos los usuarios interactúen de manera respetuosa y cortés. Se prohíbe cualquier forma de comunicación ofensiva, insultante, discriminatoria, difamatoria o que atente contra la dignidad.</li>
      <li><strong>Contenido Apropiado</strong>: Se prohíbe la publicación de contenido obsceno, vulgar, indecente, pornográfico o inapropiado, especialmente para menores de edad.</li>
      <li><strong>Publicidad y SPAM</strong>: Se prohíbe la promoción no autorizada y el SPAM, incluyendo mensajes repetitivos, irrelevantes o comerciales no solicitados.</li>
      <li><strong>Veracidad y Exactitud</strong>: Se prohíbe la difusión de información falsa, engañosa o fraudulenta que induzca a error o afecte la integridad de la comunidad.</li>
      <li><strong>Respeto a la Propiedad Intelectual</strong>: Se prohíbe publicar contenido que infrinja derechos de autor, marcas, patentes u otros derechos de propiedad.</li>
    </ol>

    <h2>Reserva de Derechos y Acciones Correctivas</h2>

    <ol>
      <li><strong>Eliminación de Contenido</strong>: Se podrá eliminar contenido que contravenga estas políticas, sin previo aviso.</li>
      <li><strong>Bloqueo y Restricción</strong>: Se podrá bloquear o restringir a usuarios reincidentes o que representen una amenaza.</li>
      <li><strong>Reporte</strong>: Se podrá reportar contenido ilícito o que viole leyes y regulaciones a las autoridades competentes.</li>
    </ol>

    <h2>Compromiso con la Integridad y la Seguridad</h2>

    <ol>
      <li><strong>Protección de la Privacidad</strong>: No se divulgará información personal sin consentimiento, salvo obligación legal.</li>
      <li><strong>Ambiente de Comunidad</strong>: Se promoverá diálogo constructivo y respeto a la diversidad de opiniones.</li>
      <li><strong>Atención al Usuario</strong>: Se brindará atención y respuesta oportuna en la medida de lo posible.</li>
    </ol>

    <p>
      La participación implica aceptación de estas políticas. <strong>CANALES®</strong> se reserva el derecho de modificar estas políticas
      en cualquier momento. Se recomienda revisarlas periódicamente.
    </p>
