<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Redirigiendo… · CANALES</title>
<link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet" type="text/css" />
    <link href="https://cdn.mcq.cl/assets/vendor/bootstrap-icons-2/bootstrap-icons.css" rel="stylesheet">
    

    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.mcq.cl/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://cdn.mcq.cl/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="194x194" href="https://cdn.mcq.cl/favicon-194x194.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://cdn.mcq.cl/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://cdn.mcq.cl/favicon-16x16.png">
<link rel="manifest" href="https://www.canales.pe/site.webmanifest">
<link rel="mask-icon" href="https://cdn.mcq.cl/safari-pinned-tab.svg" color="#0572cd">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<meta name="apple-mobile-web-app-title" content="Manuel Canales Q.">
<meta name="application-name" content="Manuel Canales Q.">
<meta name="msapplication-TileColor" content="#0572cd">
<meta name="msapplication-TileImage" content="https://cdn.mcq.cl/mstile-144x144.png">
<meta name="theme-color" content="#0572cd">
<meta name="robots" content="noindex, nofollow">
<style>
html,body{
  height:100%;
  margin:0;
  overflow:hidden; /* evita scroll */
  background:#000;
  color:#fff;
  font-family:Inter,system-ui,sans-serif;
}
/* ===== CONTENEDOR ===== */
#redir{
  position:relative;
  height:100vh;
  overflow:hidden;
  isolation:isolate;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(16px,3vw,32px);
}
/* ===== FONDO ===== */
#redir .bg{position:fixed;inset:0;z-index:0}
#redir .bg .base{
  position:absolute;inset:-15%;
  background:
    radial-gradient(120% 80% at 65% 30%, #121318 0%, #0a0c12 56%, #05070b 72%, #000 88%),
    radial-gradient(60% 55% at 18% 78%, #0a0d14 0%, #000 70%);
  filter:contrast(1.05) saturate(1.02);
}
#redir .gblob{
  position:absolute;border-radius:50%;filter:blur(var(--blur,80px));
  mix-blend-mode:screen;opacity:var(--op,.25);
  background:radial-gradient(circle at 30% 30%, hsla(var(--h,210) var(--s,80%) var(--l,62%) / .85) 0%, transparent 60%);
  animation:floaty var(--dur,22s) ease-in-out infinite alternate;
}
@keyframes floaty{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--dx,6vw),var(--dy,4vh),0)}}
/* ===== LLUVIA ===== */
#redir .rain{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#redir .emoji{
  position:absolute;will-change:transform,opacity;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.55));
  font-size:clamp(28px,5.5vw,56px);
  opacity:.95;animation:fall linear forwards;
}
@keyframes fall{0%{transform:translateY(-12vh) rotate(0)}100%{transform:translateY(112vh) rotate(360deg);opacity:.6}}
/* ===== CARD ===== */
#redir .card{
  position:relative;z-index:5;width:min(560px,94vw);
  background:linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.14);
  border-radius:24px;
  backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 28px 70px rgba(0,0,0,.62);
  padding:clamp(28px,6vw,52px);
  text-align:center;
}
#redir .brand{width:clamp(150px,36vw,230px);height:auto;margin-bottom:.8rem}
#redir .title{
  margin:.2rem 0 .4rem;
  line-height:1.08;
  font-size:clamp(34px,7.2vw,56px);
  font-weight:900;
  font-style:italic;
  font-variation-settings:"wght" 900, "slnt" -6;
  text-shadow:0 2px 24px rgba(255,255,255,.16)
}
#redir .desc{color:#bbc1c8;margin:.4rem 0 1rem;font-size:clamp(14px,3.6vw,16px)}
#redir .host{color:#dfe6ee;font-weight:700}
/* progreso */
#redir .bar{
  --c:#56a8ff;
  position:relative;height:10px;border-radius:999px;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.16);
  overflow:hidden;margin:0 auto 1rem;max-width:420px
}
#redir .bar > i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg, #56a8ff, #7b6cff, #35e7a6);
  transition:width .2s ease;
}
#redir .count{opacity:.85;margin-bottom:1rem}
#redir .btn{
  display:inline-grid;place-items:center;padding:12px 22px;
  border-radius:14px;color:#fff;text-decoration:none;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 12px 28px rgba(0,0,0,.28);
  transition:.22s ease
}
#redir .btn:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
</style>
</head>
<body>
<section id="redir">
  <div class="bg"><div class="base"></div></div>
  <div class="rain" id="rain"></div>
  <article class="card">
    <img class="brand" src="https://cdn.mcq.cl/logo/canales-white.svg" alt="CANALES">
    <h1 class="title" id="dyn">Redirigiendo…</h1>
    <p class="desc">Estamos saliendo de <strong>canales.pe</strong>. Tranquil@ el detino ya está verificado <i class="bi bi-patch-check"></i>
    </p>
    <div class="bar"><i id="fill"></i></div>
    <div class="count" id="count">Serás redirigido en <strong>8</strong> s.</div>

  </article>
</section>
<script>
(() => {
  const secs = 8;
  const target = "https://www.instagram.com/manuelcanales";
  const fill = document.getElementById("fill");
  const count = document.querySelector("#count strong");

  let elapsed = 0, left = secs;
  const total = secs * 1000;
  const step = 100;

  const timer = setInterval(() => {
    elapsed += step;
    fill.style.width = Math.min(100, (elapsed / total) * 100) + "%";
  }, step);

  const secTimer = setInterval(() => {
    left--; count.textContent = left;
    if (left <= 0) {
      clearInterval(timer);
      clearInterval(secTimer);
      location.href = target;
    }
  }, 1000);

  const EMOJIS = ["🔗","🚀","🧭","✅","↗️","✨"];
  const rain = document.getElementById("rain");

  function drop() {
    const el = document.createElement("span");
    el.className = "emoji";
    el.textContent = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
    el.style.left = Math.random()*100 + "vw";
    el.style.animationDuration = (4 + Math.random()*7) + "s";
    el.style.fontSize = (26 + Math.random()*44) + "px";
    rain.appendChild(el);
    el.addEventListener("animationend", ()=>el.remove());
  }
  setInterval(drop, 480);

  const bg = document.querySelector('.bg');
  function blob() {
    const b = document.createElement('div');
    b.className = 'gblob';
    const hue = [200,220,250,155,165][Math.floor(Math.random()*5)];
    const size = 30 + Math.random()*40;
    Object.assign(b.style,{
      width:size+'vw',height:size+'vw',left:Math.random()*80+'vw',top:Math.random()*70+'vh'
    });
    b.style.setProperty('--h', hue);
    b.style.setProperty('--s', 80+'%');
    b.style.setProperty('--l', 60+'%');
    b.style.setProperty('--blur', 100+'px');
    b.style.setProperty('--dur', (20+Math.random()*10)+'s');
    b.style.setProperty('--dx', (Math.random()<.5?-1:1)*8+'vw');
    b.style.setProperty('--dy', (Math.random()<.5?-1:1)*6+'vh');
    bg.appendChild(b);
  }
  for(let i=0;i<6;i++) blob();
})();
</script>
</body>
</html>
