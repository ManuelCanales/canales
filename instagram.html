    <style>
      :root {
        --bg: #050505;
        --bg-2: #0a0a0a;
        --panel: rgba(14, 14, 14, 0.72);
        --panel-2: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.08);
        --muted: rgba(255, 255, 255, 0.68);
        --muted-2: rgba(255, 255, 255, 0.44);
        --text: #ffffff;
        --ig1: #f58529;
        --ig2: #dd2a7b;
        --ig3: #8134af;
        --ig4: #515bd4;
        --radius-xl: 34px;
        --radius-lg: 24px;
        --radius-md: 18px;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        --max: 1160px;
        --transition: 280ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 16% 18%, rgba(245, 133, 41, 0.18) 0%, rgba(245, 133, 41, 0.08) 16%, transparent 42%),
          radial-gradient(circle at 82% 18%, rgba(221, 42, 123, 0.14) 0%, transparent 28%),
          radial-gradient(circle at 68% 82%, rgba(81, 91, 212, 0.12) 0%, transparent 28%),
          linear-gradient(180deg, #130a14 0%, #050505 100%);
        overflow-x: hidden;
        position: relative;
      }

      a {
        color: inherit;
      }

      .ig-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        isolation: isolate;
      }

      .ig-bg::before,
      .ig-bg::after {
        content: "";
        position: absolute;
        inset: -8%;
        pointer-events: none;
      }

      .ig-bg::before {
        background: radial-gradient(circle at 18% 24%, rgba(245, 133, 41, 0.2) 0%, transparent 34%), radial-gradient(circle at 80% 20%, rgba(221, 42, 123, 0.16) 0%, transparent 28%), radial-gradient(circle at 64% 80%, rgba(81, 91, 212, 0.14) 0%, transparent 30%);
        filter: blur(36px);
        opacity: 0.92;
        animation: igGradientDriftA 18s ease-in-out infinite alternate;
      }

      .ig-bg::after {
        background: linear-gradient(135deg, rgba(129, 52, 175, 0.08) 0%, transparent 42%, rgba(245, 133, 41, 0.04) 76%, transparent 100%);
        filter: blur(54px);
        opacity: 0.88;
        animation: igGradientDriftB 24s ease-in-out infinite alternate;
      }

      .ig-watermark {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(221, 42, 123, 0.14);
        mix-blend-mode: screen;
        will-change: transform, opacity, filter;
      }

      .ig-watermark--a {
        top: 50%;
        left: 58%;
        width: clamp(340px, 54vw, 860px);
        transform: translate3d(-50%, -50%, 0) rotate(-12deg) scale(1);
        opacity: 0.09;
        filter: blur(14px);
        animation: igLogoFloatA 18s ease-in-out infinite alternate,
                   igLogoPulse 9s ease-in-out infinite;
      }

      .ig-watermark--b {
        top: 16%;
        right: -4%;
        width: clamp(180px, 24vw, 360px);
        transform: rotate(-8deg) scale(0.96);
        opacity: 0.038;
        filter: blur(19px);
        animation: igLogoFloatB 22s ease-in-out infinite alternate,
                   igLogoPulse 11s ease-in-out infinite reverse;
      }

      .ig-logo-wrap {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .ig-logo-wrap .ig-wordmark,
      .ig-logo-wrap .ig-separator,
      .ig-logo-wrap .ig-canales-logo {
        display: none !important;
      }

      .ig-logo-wrap .ig-logo,
      .ig-logo-wrap .ig-giphy-logo,
      .ig-logo-wrap .ig-instagram-logo,
      .ig-logo-wrap .ig-tiktok-logo,
      .ig-logo-wrap img,
      .ig-logo-wrap svg {
        display: block;
        width: 100% !important;
        height: auto !important;
        max-width: none;
        object-fit: contain;
        color: rgba(221, 42, 123, 0.14);
      }

      .ig-bg .ig-logo-wrap svg,
      .ig-bg .ig-logo-wrap img {
        opacity: 1;
      }

      .ig-bg .ig-logo-wrap path,
      .ig-bg .ig-logo-wrap rect,
      .ig-bg .ig-logo-wrap circle {
        vector-effect: non-scaling-stroke;
      }
      @keyframes igGradientDriftA {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(-2.2%, 2.8%, 0) scale(1.04); }
      }

      @keyframes igGradientDriftB {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(2.6%, -2.4%, 0) scale(1.06); }
      }

      @keyframes igLogoFloatA {
        0% { transform: translate3d(-50%, -50%, 0) rotate(-12deg) scale(1); }
        100% { transform: translate3d(-48%, -52%, 0) rotate(-8deg) scale(1.05); }
      }

      @keyframes igLogoFloatB {
        0% { transform: translate3d(0, 0, 0) rotate(-8deg) scale(0.96); }
        100% { transform: translate3d(-1.4vw, 2.2vh, 0) rotate(-12deg) scale(1.02); }
      }

      @keyframes igLogoPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.86; }
      }

      @media (max-width: 900px) {
        .ig-watermark--a {
          left: 50%;
          width: clamp(280px, 68vw, 620px);
          opacity: 0.074;
          filter: blur(10px);
        }

        .ig-watermark--b {
          top: 11%;
          right: auto;
          left: 74%;
          width: clamp(150px, 24vw, 240px);
          opacity: 0.03;
          filter: blur(13px);
        }
      }

      @media (max-width: 520px) {
        .ig-watermark--a {
          left: 50%;
          top: 47%;
          width: min(92vw, 460px);
          opacity: 0.094;
          filter: blur(11px);
        }

        .ig-watermark--b {
          top: 8%;
          left: 72%;
          width: min(40vw, 170px);
          opacity: 0.042;
          filter: blur(15px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ig-watermark--a,
        .ig-watermark--b {
          animation: none !important;
        }

        .ig-bg::before,
        .ig-bg::after {
          animation: none !important;
        }
      }


      @keyframes floatOne {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(70px, 40px, 0) scale(1.08); }
      }

      @keyframes floatTwo {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(-70px, 46px, 0) scale(1.08); }
      }

      @keyframes floatThree {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(28px, -34px, 0) scale(1.08); }
      }

      .ig-shell {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: var(--max);
        min-height: 100vh;
        margin: 0 auto;
        padding: 34px 20px;
        display: flex;
        align-items: center;
      }

      .ig-layout {
        width: 100%;
        display: grid;
        grid-template-columns: 1.08fr 0.92fr;
        gap: 28px;
        align-items: center;
      }

      .ig-left {
        padding-right: 8px;
      }

      .ig-lockup {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: nowrap;
        min-height: 54px;
        padding: 0 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        margin-bottom: 26px;
      }

      .ig-instagram-logo,
      .ig-canales-logo {
        display: block;
        width: auto;
        height: 22px;
        flex: 0 0 auto;
      }

      .ig-separator {
        font-size: 0.92rem;
        font-weight: 900;
        color: rgba(255, 255, 255, 0.72);
        line-height: 1;
        flex: 0 0 auto;
      }

      .ig-name {
        margin: 0 0 10px;
        font-size: clamp(1.1rem, 1.9vw, 1.5rem);
        line-height: 1.15;
        letter-spacing: -0.03em;
        font-weight: 800;
      }

      .ig-username-wrap {
        width: 100%;
        max-width: 760px;
        overflow: hidden;
        margin-bottom: 14px;
      }

      .ig-username {
        margin: 0;
        display: block;
        width: 100%;
        line-height: 0.92;
        letter-spacing: -0.08em;
        font-weight: 900;
        white-space: nowrap;
        font-size: 108px;
      }

      .ig-copy {
        margin: 0;
        max-width: 620px;
        font-size: 1.02rem;
        line-height: 1.72;
        color: var(--muted);
      }

      .ig-right-card {
        border-radius: var(--radius-xl);
        padding: 24px;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02)),
          rgba(12, 12, 12, 0.72);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .ig-stats {
        display: grid;
        gap: 12px;
        margin-bottom: 18px;
      }

      .ig-stat {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 18px 18px;
        border-radius: var(--radius-lg);
        background:
          linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01)),
          var(--panel-2);
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: transform var(--transition), border-color var(--transition);
      }

      .ig-stat:hover {
        transform: translateY(-2px);
        border-color: rgba(255,255,255,0.1);
      }

      .ig-stat-label {
        display: block;
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted-2);
        margin-bottom: 6px;
      }

      .ig-stat-value {
        display: block;
        font-size: clamp(1.25rem, 2.4vw, 1.6rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
        font-weight: 900;
      }

      .ig-stat-accent {
        width: 10px;
        height: 44px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--ig1), var(--ig2), var(--ig3), var(--ig4));
        opacity: 0.95;
      }

      .ig-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 64px;
        padding: 16px 22px;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, var(--ig1) 0%, var(--ig2) 40%, var(--ig3) 72%, var(--ig4) 100%);
        color: #fff;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 900;
        box-shadow: 0 16px 34px rgba(129, 52, 175, 0.24);
        transition: transform var(--transition), filter var(--transition), box-shadow var(--transition);
      }

      .ig-cta:hover {
        transform: translateY(-2px);
        filter: brightness(1.04);
        box-shadow: 0 20px 40px rgba(129, 52, 175, 0.3);
      }

      .ig-cta-outline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 58px;
        margin-top: 12px;
        padding: 14px 22px;
        border-radius: var(--radius-md);
        border: 1px solid rgba(221, 42, 123, 0.42);
        background: rgba(255, 255, 255, 0.02);
        color: #ffffff;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 800;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: transform var(--transition), background var(--transition), border-color var(--transition), box-shadow var(--transition);
      }

      .ig-cta-outline:hover {
        transform: translateY(-2px);
        background: rgba(221, 42, 123, 0.12);
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.18);
      }

      .ig-note {
        margin-top: 12px;
        text-align: center;
        font-size: 0.83rem;
        color: var(--muted-2);
      }

      @media (max-width: 900px) {
        .ig-shell {
          padding: 22px 14px;
          align-items: flex-start;
        }

        .ig-layout {
          grid-template-columns: 1fr;
          gap: 18px;
        }

        .ig-left {
          padding-right: 0;
          text-align: center;
        }

        .ig-copy {
          margin: 0 auto;
        }

        .ig-username-wrap {

        }
      }

          display: none;
        }

        .ig-cta {
          min-height: 58px;
          font-size: 0.92rem;
          padding: 14px 18px;
        }
      }

          width: auto !important;
        }
      }

    
      /* Responsive hardening patch */
      .ig-shell {
        width: min(100%, var(--max));
        padding-inline: clamp(12px, 3vw, 24px);
      }

      .ig-layout {
        grid-template-columns: minmax(0, 1fr) minmax(0, 420px);
        gap: clamp(18px, 2.5vw, 32px);
      }

      .ig-left,
      .ig-right,
      .ig-username-wrap,
      .ig-right-card,
      .ig-brand,
      .ig-lockup {
        min-width: 0;
      }

      .ig-left {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
      }

      .ig-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }

      .ig-right-card {
        width: 100%;
        max-width: 420px;
        margin-left: auto;
      }

      .ig-lockup {
        width: fit-content;
        max-width: 100%;
      }

      .ig-username-wrap {
        display: flex;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
      }

      .ig-username {
        display: block;
        max-width: 100%;
        white-space: nowrap;
      }

      .ig-copy {
        max-width: 100%;
        text-wrap: pretty;
      }

      .ig-name {
        display: flex;
        align-items: center;
        align-content: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .ig-name > * {
        flex: 0 0 auto;
      }

      .ig-instagram-logo,
      .ig-canales-logo {
        max-width: 100%;
        width: auto !important;
        object-fit: contain;
        flex: 0 0 auto;
      }

      @media (max-width: 900px) {
        .ig-shell {
          min-height: auto;
          padding: 20px 14px 24px;
          align-items: flex-start;
        }

        .ig-layout {
          grid-template-columns: minmax(0, 1fr);
          gap: 16px;
        }

        .ig-left,
        .ig-right {
          width: 100%;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding-right: 0;
        }

        .ig-right-card {
          max-width: 100%;
          margin-left: 0;
        }

        .ig-lockup {
          width: 100%;
          max-width: 420px;
          margin-inline: auto;
          justify-content: center;
          flex-wrap: wrap;
          row-gap: 8px;
          column-gap: 10px;
          padding: 10px 14px;
          min-height: auto;
          text-align: center;
        }

        .ig-brand,
        .ig-name,
        .ig-username-wrap {
          justify-content: center;
        }

        .ig-copy {
          margin-inline: auto;
        }
      }

      @media (max-width: 640px) {
        .ig-shell {
          padding: 16px 12px 24px;
        }

        .ig-lockup {
          border-radius: 20px;
          padding: 10px 12px;
        }

        .ig-right-card {
          padding: 16px;
          border-radius: 22px;
        }

        .ig-name {
          justify-content: center;
          margin-bottom: 8px;
          font-size: 1rem;
        }

        .ig-copy {
          font-size: 0.94rem;
          line-height: 1.58;
        }

        .ig-stat {
          grid-template-columns: 1fr;
          text-align: left;
          padding: 15px;
        }

        .ig-stat-accent {
          display: none;
        }

        .ig-instagram-logo,
        .ig-canales-logo {
          height: 18px;
        }

        .ig-logo,
        .ig-wordmark {
          max-width: 100%;
        }
      }


      /* Mobile centering final patch */
      @media (max-width: 900px) {
        .ig-shell {
          align-items: center !important;
          justify-content: center;
          min-height: 100vh;
          padding: 20px 14px 28px;
        }
        .ig-layout { justify-items: center; }
        .ig-left,
        .ig-right {
          width: 100%;
          max-width: 680px;
          margin-inline: auto;
          align-items: center !important;
          justify-content: center !important;
          text-align: center !important;
        }
        .ig-lockup {
          width: auto !important;
          max-width: min(100%, 420px);
          margin-inline: auto;
          justify-content: center !important;
        }
        .ig-name,
        .ig-username-wrap,
        .ig-copy {
          justify-content: center !important;
          text-align: center !important;
          margin-inline: auto;
        }
        .ig-right-card {
          width: min(100%, 420px);
          margin-inline: auto;
          text-align: center;
        }
        .ig-stats { justify-items: center; }
        .ig-stat { width: 100%; text-align: center !important; }
        .ig-stat-label,
        .ig-stat-value,
        .ig-note { text-align: center !important; }
      }
      @media (max-width: 640px) {
        .ig-username { margin-inline: auto; }
        .ig-copy { max-width: 34ch; }
      }

    <script>
      const usernameEl = document.getElementById("igUsername");
      const handleInlineEl = document.getElementById("igHandleInline");
      const ctaEl = document.getElementById("igCta");

      function normalizeHandle(text) {
        return text.trim().replace(/^@+/, "");
      }

      function getBaseFontSize(len, compact) {
        const desktopRules = [
          { max: 8, size: 108 },
          { max: 10, size: 94 },
          { max: 12, size: 82 },
          { max: 14, size: 72 },
          { max: 16, size: 64 },
          { max: 18, size: 58 },
          { max: 99, size: 52 }
        ];

        const mobileRules = [
          { max: 8, size: 52 },
          { max: 10, size: 46 },
          { max: 12, size: 40 },
          { max: 14, size: 35 },
          { max: 16, size: 31 },
          { max: 18, size: 28 },
          { max: 99, size: 26 }
        ];

        const rules = compact ? mobileRules : desktopRules;
        return rules.find(rule => len <= rule.max).size;
      }

      function fitUsernameToWidth() {
        if (!usernameEl) return;

        const wrap = usernameEl.parentElement;
        if (!wrap) return;

        const rawText = usernameEl.textContent.trim();
        const compact = window.innerWidth <= 900;
        let size = getBaseFontSize(rawText.length, compact);
        const min = compact ? 24 : 40;
        const available = Math.max(0, wrap.clientWidth - 2);

        usernameEl.style.fontSize = size + "px";
        usernameEl.style.maxWidth = "100%";
        usernameEl.style.whiteSpace = "nowrap";

        while (usernameEl.scrollWidth > available && size > min) {
          size -= 1;
          usernameEl.style.fontSize = size + "px";
        }
      }

      function syncProfileData() {
        if (!usernameEl || !ctaEl) return;

        const rawText = usernameEl.textContent.trim();
        const handle = normalizeHandle(rawText);

        if (handleInlineEl) {
          handleInlineEl.textContent = handle;
        }

        ctaEl.href = "https://www.instagram.com/" + handle;
        fitUsernameToWidth();
      }

      syncProfileData();
      window.addEventListener("resize", () => window.requestAnimationFrame(syncProfileData));

      if (usernameEl) {
        const observer = new MutationObserver(() => window.requestAnimationFrame(syncProfileData));
        observer.observe(usernameEl, {
          childList: true,
          characterData: true,
          subtree: true
        });
      }
    </script>
