<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>CANALES · Pagos</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;
  font-family:"Archivo",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15171c;
  background:
    radial-gradient(circle at 12% 12%,rgba(255,255,255,.92),transparent 28%),
    radial-gradient(circle at 88% 18%,rgba(181,215,255,.72),transparent 30%),
    radial-gradient(circle at 75% 85%,rgba(219,196,255,.66),transparent 30%),
    linear-gradient(145deg,#dfe8ff,#f0e8ff 55%,#def3ee);
}
.voucher{
  width:min(430px,100%);padding:26px 20px 22px;border-radius:32px;
  background:linear-gradient(145deg,rgba(255,255,255,.74),rgba(255,255,255,.38));
  border:1px solid rgba(255,255,255,.78);
  box-shadow:0 24px 60px rgba(40,50,80,.16),inset 0 1px 0 rgba(255,255,255,.95);
  backdrop-filter:blur(28px) saturate(150%);
}
.canales{display:block;width:118px;margin:0 auto 9px}
.kicker,.sub{text-align:center;color:#747985;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}
.kicker{letter-spacing:.18em}
h1{text-align:center;font-family:"Archivo",system-ui,sans-serif;font-size:31px;margin:18px 0 6px;letter-spacing:-.045em;font-weight:900;text-transform:uppercase;line-height:.95}
.sub{margin-bottom:22px}
.buttons{display:grid;gap:12px}
.pay-btn{
  width:100%;height:76px;border:0;border-radius:20px;color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 24px rgba(0,0,0,.10);
  transition:.16s ease;
}
.pay-btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
.pay-btn.yape{background:#650A7B}
.pay-btn.plin{background:linear-gradient(135deg,#0B8EF3,#16D1B8)}
.logo-wrap{display:grid;place-items:center;flex:none}
.logo-wrap svg{width:100%;height:100%;display:block}
.pay-label{font-family:"Archivo",system-ui,sans-serif;font-size:19px;font-weight:900;letter-spacing:-.015em;text-transform:uppercase;line-height:1;text-shadow:0 1px 10px rgba(0,0,0,.14);transition:transform .22s ease,letter-spacing .22s ease}
.note{text-align:center;margin-top:16px;color:#747985;font-size:10px}
.modal{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(30,32,45,.30);backdrop-filter:blur(18px)
}
.modal.open{display:flex}
.card{
  width:min(390px,100%);padding:22px;border-radius:30px;text-align:center;position:relative;
  background:linear-gradient(145deg,rgba(255,255,255,.86),rgba(255,255,255,.54));
  border:1px solid rgba(255,255,255,.9);box-shadow:0 28px 70px rgba(35,40,65,.24);
}
.close{position:absolute;right:13px;top:12px;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:rgba(255,255,255,.28);font-size:20px;backdrop-filter:blur(12px);cursor:pointer}
.modal-logo{margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
.modal-logo svg,.modal-logo img{width:100%;height:100%;display:block;object-fit:contain;background:transparent;mix-blend-mode:multiply}
.modal-title{font-family:"Archivo",system-ui,sans-serif;font-size:27px;font-weight:900;letter-spacing:-.035em;text-transform:uppercase;line-height:1}
.modal-sub{color:#747985;font-size:12px;margin-top:4px}
.qr-wrap{margin:18px auto 10px;padding:12px;border-radius:24px;background:rgba(255,255,255,.78);box-shadow:0 0 26px var(--wallet-glow-soft,rgba(116,34,132,.16));border:1px solid rgba(255,255,255,.62)}
.qr{width:100%;height:100%;object-fit:contain;border-radius:14px;filter:blur(14px);transition:.2s}
.qr.show{filter:none}
.show-btn{width:100%;margin-top:12px;border:0;border-radius:16px;padding:14px;background:#111318;color:#fff;font-family:"Archivo",system-ui,sans-serif;font-size:13px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 22px rgba(0,0,0,.12);transition:.16s ease}

/* Wallet motifs on hover */
.pay-btn.yape{
  isolation:isolate;
}
.pay-btn.plin{
  isolation:isolate;
}

.pay-btn.yape::before,
.pay-btn.plin::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity .22s ease, transform .28s ease;
  pointer-events:none;
  z-index:0;
}

.pay-btn.yape::before{
  background:
    radial-gradient(circle at 12% 25%, rgba(17,205,183,.95) 0 7px, transparent 8px),
    radial-gradient(circle at 22% 72%, rgba(255,255,255,.18) 0 18px, transparent 19px),
    radial-gradient(circle at 82% 26%, rgba(255,255,255,.12) 0 26px, transparent 27px),
    radial-gradient(circle at 92% 80%, rgba(17,205,183,.55) 0 12px, transparent 13px),
    linear-gradient(145deg, rgba(255,255,255,.08), transparent 44%);
  transform:scale(.96);
}

.pay-btn.plin::before{
  background:
    radial-gradient(circle at 14% 30%, rgba(255,255,255,.20) 0 22px, transparent 23px),
    radial-gradient(circle at 28% 78%, rgba(255,95,162,.58) 0 7px, transparent 8px),
    radial-gradient(circle at 80% 22%, rgba(255,255,255,.16) 0 30px, transparent 31px),
    radial-gradient(circle at 90% 74%, rgba(22,209,184,.75) 0 18px, transparent 19px),
    linear-gradient(125deg, rgba(11,142,243,.32), rgba(22,209,184,.14) 46%, transparent 72%);
  transform:scale(.96) rotate(-1deg);
}

.pay-btn.yape:hover::before,
.pay-btn.plin:hover::before{
  opacity:1;
  transform:scale(1);
}

/* Keep label over decorative motifs */
.pay-btn .pay-label{
  position:relative;
  z-index:2;
}

/* subtle animated sheen */
.pay-btn.yape::after,
.pay-btn.plin::after{
  content:"";
  position:absolute;
  top:-30%;
  left:-55%;
  width:42%;
  height:160%;
  transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
  transition:left .45s ease;
  pointer-events:none;
  z-index:1;
}

.pay-btn:hover::after{
  left:115%;
}


body{
  transition:background .35s ease;
}
body::before,
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:0;
  transition:opacity .35s ease, transform .45s ease;
  z-index:-1;
}
body::before{
  background:
    radial-gradient(circle at 18% 28%,rgba(101,10,123,.30),transparent 28%),
    radial-gradient(circle at 78% 20%,rgba(17,205,183,.24),transparent 24%),
    linear-gradient(145deg,#eadff2,#f5e9f8 55%,#dff7f1);
  transform:scale(1.03);
}
body::after{
  background:
    radial-gradient(circle at 20% 25%,rgba(11,142,243,.28),transparent 28%),
    radial-gradient(circle at 82% 24%,rgba(22,209,184,.28),transparent 26%),
    radial-gradient(circle at 75% 80%,rgba(255,95,162,.14),transparent 24%),
    linear-gradient(145deg,#dcecff,#e5fbf7 55%,#e9f7ff);
  transform:scale(1.03);
}




.pay-btn.yape:hover{background-position:88% 50%}
.pay-btn.plin:hover{background-position:88% 50%}

.pay-btn{
  will-change:transform;
}
.pay-btn:active{
  transform:translateY(-1px) scale(.995);
}

/* stronger wallet motif animation */
.pay-btn.yape:hover::before{
  animation:yapeMotif .85s ease both;
}
.pay-btn.plin:hover::before{
  animation:plinMotif .85s ease both;
}
@keyframes yapeMotif{
  0%{opacity:0;transform:scale(.94) translateX(-8px)}
  100%{opacity:1;transform:scale(1) translateX(0)}
}
@keyframes plinMotif{
  0%{opacity:0;transform:scale(.94) rotate(-2deg) translateX(-8px)}
  100%{opacity:1;transform:scale(1) rotate(0) translateX(0)}
}


/* --- Disruptive wallet focus interaction --- */
.voucher{
  transition:
    transform .38s cubic-bezier(.2,.8,.2,1),
    box-shadow .38s ease,
    border-color .38s ease,
    background .38s ease;
}
.voucher::after{
  transition:
    background .38s ease,
    transform .55s cubic-bezier(.2,.8,.2,1),
    opacity .38s ease;
}

.buttons{
  position:relative;
  perspective:900px;
}
.pay-btn{
  transition:
    transform .32s cubic-bezier(.2,.8,.2,1),
    filter .28s ease,
    box-shadow .32s ease,
    background .36s ease,
    color .28s ease,
    border-color .28s ease,
    opacity .28s ease;
  border:1.5px solid transparent;
}

/* Active Yape */
body.focus-yape .voucher{
  transform:translateY(-2px) rotateX(.35deg) rotateY(-.45deg);
  border-color:rgba(116,34,132,.28);
  box-shadow:
    0 30px 72px rgba(101,10,123,.17),
    0 0 54px rgba(17,205,183,.10),
    inset 0 1px 0 rgba(255,255,255,.96);
}
body.focus-yape .pay-btn.yape{
  transform:translateY(-5px) scale(1.025);
  box-shadow:
    0 22px 46px rgba(101,10,123,.28),
    0 0 0 1px rgba(255,255,255,.10) inset,
    inset 0 1px 0 rgba(255,255,255,.28);
}
body.focus-yape .pay-btn.plin{
  background:rgba(255,255,255,.08) !important;
  color:#099fb4;
  border-color:rgba(10,174,193,.42);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.46);
  transform:scale(.965);
  opacity:.70;
}
body.focus-yape .pay-btn.plin::before,
body.focus-yape .pay-btn.plin::after{opacity:0!important}

/* Active Plin */
body.focus-plin .voucher{
  transform:translateY(-2px) rotateX(.35deg) rotateY(.45deg);
  border-color:rgba(12,190,203,.30);
  box-shadow:
    0 30px 72px rgba(11,142,243,.16),
    0 0 54px rgba(22,209,184,.13),
    inset 0 1px 0 rgba(255,255,255,.96);
}
body.focus-plin .pay-btn.plin{
  transform:translateY(-5px) scale(1.025);
  box-shadow:
    0 22px 46px rgba(8,158,206,.25),
    0 0 0 1px rgba(255,255,255,.10) inset,
    inset 0 1px 0 rgba(255,255,255,.28);
}
body.focus-plin .pay-btn.yape{
  background:rgba(255,255,255,.08) !important;
  color:#702082;
  border-color:rgba(112,32,130,.40);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.46);
  transform:scale(.965);
  opacity:.70;
}
body.focus-plin .pay-btn.yape::before,
body.focus-plin .pay-btn.yape::after{opacity:0!important}

/* Active-button typography gets a small optical push */
body.focus-yape .pay-btn.yape .pay-label,
body.focus-plin .pay-btn.plin .pay-label{
  transform:translateY(-1px) scale(1.035);
  letter-spacing:-.005em;
}

/* Animated ambient color moving inside voucher */
.voucher .ambient-orb{
  position:absolute;
  width:240px;
  height:240px;
  border-radius:50%;
  filter:blur(28px);
  opacity:0;
  pointer-events:none;
  z-index:0;
  transition:
    opacity .34s ease,
    transform .52s cubic-bezier(.2,.8,.2,1),
    background .34s ease;
}
.voucher .ambient-orb.yape-orb{
  left:-110px;
  top:150px;
  background:radial-gradient(circle,rgba(116,34,132,.26),rgba(17,205,183,.10) 48%,transparent 70%);
  transform:translateX(-25px) scale(.86);
}
.voucher .ambient-orb.plin-orb{
  right:-110px;
  top:150px;
  background:radial-gradient(circle,rgba(11,142,243,.24),rgba(22,209,184,.15) 48%,transparent 70%);
  transform:translateX(25px) scale(.86);
}
body.focus-yape .yape-orb{
  opacity:1;
  transform:translateX(0) scale(1);
}
body.focus-plin .plin-orb{
  opacity:1;
  transform:translateX(0) scale(1);
}

/* Touch/focus parity */
.pay-btn:focus-visible{
  outline:3px solid rgba(20,20,25,.18);
  outline-offset:3px;
}


/* Main voucher adopts the active wallet identity */
body.focus-yape .voucher{
  background:
    radial-gradient(circle at 18% 18%,rgba(255,255,255,.16),transparent 26%),
    radial-gradient(circle at 82% 20%,rgba(17,205,183,.20),transparent 24%),
    linear-gradient(135deg,#56066B 0%,#741D86 52%,#5A086F 100%);
  color:#fff;
  border-color:rgba(255,255,255,.20);
  box-shadow:
    0 30px 80px rgba(80,0,95,.30),
    0 0 70px rgba(17,205,183,.14),
    inset 0 1px 0 rgba(255,255,255,.20);
}
body.focus-plin .voucher{
  background:
    radial-gradient(circle at 18% 18%,rgba(255,255,255,.16),transparent 27%),
    radial-gradient(circle at 84% 24%,rgba(255,95,162,.12),transparent 24%),
    linear-gradient(135deg,#087FE9 0%,#0DBED3 52%,#15CDB6 100%);
  color:#fff;
  border-color:rgba(255,255,255,.22);
  box-shadow:
    0 30px 80px rgba(0,116,180,.28),
    0 0 70px rgba(22,209,184,.18),
    inset 0 1px 0 rgba(255,255,255,.20);
}

/* Header/logo/readability on colored voucher */
body.focus-yape .voucher .kicker,
body.focus-yape .voucher .sub,
body.focus-plin .voucher .kicker,
body.focus-plin .voucher .sub{
  color:rgba(255,255,255,.72);
}
body.focus-yape .voucher h1,
body.focus-plin .voucher h1{
  color:#fff;
  text-shadow:0 6px 24px rgba(0,0,0,.16);
}
body.focus-yape .canales,
body.focus-plin .canales{
  filter:brightness(0) invert(1);
}

/* Active wallet button merges into the container */
body.focus-yape .pay-btn.yape,
body.focus-plin .pay-btn.plin{
  background:rgba(255,255,255,.14) !important;
  border-color:rgba(255,255,255,.28);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.24),
    0 14px 30px rgba(0,0,0,.12);
  backdrop-filter:blur(16px);
}

/* Other wallet becomes outline */
body.focus-yape .pay-btn.plin,
body.focus-plin .pay-btn.yape{
  background:transparent !important;
  color:rgba(255,255,255,.78);
  border-color:rgba(255,255,255,.42);
  box-shadow:none;
  opacity:.74;
}
body.focus-yape .pay-btn.plin:hover,
body.focus-plin .pay-btn.yape:hover{
  background:rgba(255,255,255,.08)!important;
}

/* Wallet-specific motifs move to the container itself */
body.focus-yape .voucher::before{
  background:
    radial-gradient(circle at 12% 68%,rgba(17,205,183,.34) 0 9px,transparent 10px),
    radial-gradient(circle at 82% 24%,rgba(255,255,255,.10) 0 36px,transparent 37px),
    radial-gradient(circle at 92% 78%,rgba(17,205,183,.18) 0 20px,transparent 21px),
    linear-gradient(120deg,rgba(255,255,255,.12),transparent 28%,rgba(255,255,255,.06) 70%);
}
body.focus-plin .voucher::before{
  background:
    radial-gradient(circle at 16% 72%,rgba(255,95,162,.22) 0 8px,transparent 9px),
    radial-gradient(circle at 82% 22%,rgba(255,255,255,.13) 0 38px,transparent 39px),
    radial-gradient(circle at 90% 76%,rgba(255,255,255,.09) 0 24px,transparent 25px),
    linear-gradient(120deg,rgba(255,255,255,.12),transparent 30%,rgba(255,255,255,.06) 68%);
}

/* Keep modal unaffected */
.modal .modal-title,
.modal .modal-sub{
  color:#15171c;
}


/* Keep wallet identity frozen while its modal is open */
body.modal-yape::before{opacity:1!important;transform:scale(1)!important}
body.modal-plin::after{opacity:1!important;transform:scale(1)!important}

body.modal-yape .voucher,
body.modal-plin .voucher{
  transform:scale(.985);
  filter:saturate(.92) brightness(.92);
  transition:transform .3s ease,filter .3s ease;
}

/* Modal sits over the same wallet world instead of replacing it */
body.modal-yape .modal{
  background:
    radial-gradient(circle at 50% 45%,rgba(101,10,123,.24),transparent 42%),
    rgba(35,8,43,.22);
}
body.modal-plin .modal{
  background:
    radial-gradient(circle at 50% 45%,rgba(12,190,203,.24),transparent 42%),
    rgba(0,70,100,.18);
}


/* Full-page wallet world */
body{
  transition:background .42s ease,color .3s ease;
  background:
    radial-gradient(circle at 12% 12%,rgba(255,255,255,.92),transparent 28%),
    radial-gradient(circle at 88% 18%,rgba(181,215,255,.72),transparent 30%),
    radial-gradient(circle at 75% 85%,rgba(219,196,255,.66),transparent 30%),
    linear-gradient(145deg,#dfe8ff,#f0e8ff 55%,#def3ee);
}

body.modal-yape{
  background:
    radial-gradient(circle at 16% 18%,rgba(255,255,255,.14),transparent 24%),
    radial-gradient(circle at 78% 16%,rgba(17,205,183,.20),transparent 22%),
    radial-gradient(circle at 82% 82%,rgba(255,255,255,.08),transparent 24%),
    linear-gradient(145deg,#4E075F 0%,#6B177D 50%,#3F064D 100%);
}

body.modal-plin{
  background:
    radial-gradient(circle at 16% 18%,rgba(255,255,255,.16),transparent 24%),
    radial-gradient(circle at 80% 18%,rgba(255,95,162,.12),transparent 22%),
    radial-gradient(circle at 78% 82%,rgba(255,255,255,.10),transparent 24%),
    linear-gradient(145deg,#056FCB 0%,#09AFC8 50%,#11B89F 100%);
}

/* wallet ambient motifs across entire viewport */
body.modal-yape::before{
  opacity:1!important;
  transform:scale(1)!important;
  background:
    radial-gradient(circle at 12% 30%,rgba(17,205,183,.18),transparent 16%),
    radial-gradient(circle at 82% 22%,rgba(255,255,255,.08),transparent 18%),
    radial-gradient(circle at 88% 78%,rgba(17,205,183,.12),transparent 16%);
}
body.modal-plin::after{
  opacity:1!important;
  transform:scale(1)!important;
  background:
    radial-gradient(circle at 14% 30%,rgba(255,255,255,.10),transparent 16%),
    radial-gradient(circle at 82% 22%,rgba(255,95,162,.10),transparent 16%),
    radial-gradient(circle at 88% 78%,rgba(255,255,255,.08),transparent 17%);
}

/* modal overlay becomes subtle; page background remains visible */
body.modal-yape .modal,
body.modal-plin .modal{
  background:rgba(10,12,20,.10)!important;
  backdrop-filter:blur(12px) saturate(110%);
  -webkit-backdrop-filter:blur(12px) saturate(110%);
}


/* Hover affects only the voucher; full page changes only when modal opens */
body.focus-yape,
body.focus-plin{
  background:
    radial-gradient(circle at 12% 12%,rgba(255,255,255,.92),transparent 28%),
    radial-gradient(circle at 88% 18%,rgba(181,215,255,.72),transparent 30%),
    radial-gradient(circle at 75% 85%,rgba(219,196,255,.66),transparent 30%),
    linear-gradient(145deg,#dfe8ff,#f0e8ff 55%,#def3ee);
}
body.focus-yape::before,
body.focus-plin::after{
  opacity:0!important;
}


/* STRICT BACKGROUND RULE:
   hover/focus never changes the page background; modal state does. */
body::before,
body::after{
  opacity:0 !important;
}

body.modal-yape::before{
  opacity:1 !important;
}
body.modal-plin::after{
  opacity:1 !important;
}

/* Neutral body during hover */
body:not(.modal-yape):not(.modal-plin){
  background:
    radial-gradient(circle at 12% 12%,rgba(255,255,255,.92),transparent 28%),
    radial-gradient(circle at 88% 18%,rgba(181,215,255,.72),transparent 30%),
    radial-gradient(circle at 75% 85%,rgba(219,196,255,.66),transparent 30%),
    linear-gradient(145deg,#dfe8ff,#f0e8ff 55%,#def3ee) !important;
}


.page-bg{
  position:fixed;
  inset:0;
  z-index:-10;
  background:
    radial-gradient(circle at 12% 12%,rgba(255,255,255,.92),transparent 28%),
    radial-gradient(circle at 88% 18%,rgba(181,215,255,.72),transparent 30%),
    radial-gradient(circle at 75% 85%,rgba(219,196,255,.66),transparent 30%),
    linear-gradient(145deg,#dfe8ff,#f0e8ff 55%,#def3ee);
  transition:background .42s ease,filter .42s ease;
}
.page-bg::before,
.page-bg::after{
  content:"";
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity .38s ease;
  pointer-events:none;
}
body.modal-yape .page-bg{
  background:
    radial-gradient(circle at 16% 18%,rgba(255,255,255,.13),transparent 24%),
    radial-gradient(circle at 80% 16%,rgba(17,205,183,.20),transparent 23%),
    radial-gradient(circle at 82% 82%,rgba(255,255,255,.08),transparent 24%),
    linear-gradient(145deg,#4E075F 0%,#6B177D 50%,#3F064D 100%);
}
body.modal-yape .page-bg::before{
  opacity:1;
  background:
    radial-gradient(circle at 12% 30%,rgba(17,205,183,.18),transparent 16%),
    radial-gradient(circle at 82% 22%,rgba(255,255,255,.08),transparent 18%),
    radial-gradient(circle at 88% 78%,rgba(17,205,183,.12),transparent 16%);
}
body.modal-plin .page-bg{
  background:
    radial-gradient(circle at 16% 18%,rgba(255,255,255,.14),transparent 24%),
    radial-gradient(circle at 80% 18%,rgba(255,95,162,.11),transparent 22%),
    radial-gradient(circle at 78% 82%,rgba(255,255,255,.09),transparent 24%),
    linear-gradient(145deg,#056FCB 0%,#09AFC8 50%,#11B89F 100%);
}
body.modal-plin .page-bg::after{
  opacity:1;
  background:
    radial-gradient(circle at 14% 30%,rgba(255,255,255,.10),transparent 16%),
    radial-gradient(circle at 82% 22%,rgba(255,95,162,.10),transparent 16%),
    radial-gradient(circle at 88% 78%,rgba(255,255,255,.08),transparent 17%);

:root{

function walletFocus(type){

  document.body.classList.remove('focus-yape','focus-plin');

let dustTimers = [];

const titleVariants = [
  '¿Cómo pagamos hoy?',
  '¿Con qué pagamos?',
  '¿Cuál usamos hoy?',
  '¿Cómo quieres pagar?',
  '¿Con cuál vamos hoy?'
];

let titleIndex = 0;
let titleTimer = null;

function rotateTitle(){
  const el = document.getElementById('pageTitle');
  if(!el) return;

  el.classList.add('title-fade-out');

  setTimeout(()=>{
    titleIndex = (titleIndex + 1) % titleVariants.length;
    el.textContent = titleVariants[titleIndex];
    el.classList.remove('title-fade-out');
    el.classList.add('title-fade-in');

    setTimeout(()=>{
      el.classList.remove('title-fade-in');
    }, 520);
  }, 420);
}

document.addEventListener('DOMContentLoaded',()=>{
  const el = document.getElementById('pageTitle');
  if(el) el.textContent = titleVariants[0];

  titleTimer = setInterval(rotateTitle, 4600);
});


function stopDustMotion(){
  dustTimers.forEach(clearTimeout);
  dustTimers = [];
}

function startDustMotion(){
  stopDustMotion();
  const field = document.getElementById('qrParticles');
  if(!field || field.classList.contains('hidden')) return;

  const particles = [...field.querySelectorAll('i')];
  const style = getComputedStyle(document.body);
  const palette = [
    style.getPropertyValue('--p1').trim(),
    style.getPropertyValue('--p2').trim(),
    style.getPropertyValue('--p3').trim(),
    style.getPropertyValue('--p4').trim()
  ].filter(Boolean);

  particles.forEach((p,index)=>{
    const particleColor = palette[Math.floor(Math.random()*palette.length)] || '#7b2a8f';
    const x = 2 + Math.random()*96;
    const y = 2 + Math.random()*96;
    const kindRoll = Math.random();

    // Three families: tiny dust, soft glow, short light streak
    let size, width, height, blur, baseOpacity, bg, shadow;

    if(kindRoll < .62){
      size = 1.2 + Math.random()*2.2;
      width = height = size;
      blur = Math.random()*.45;
      baseOpacity = .32 + Math.random()*.46;
      bg = `color-mix(in srgb, ${particleColor} 72%, white 28%)`;
      shadow = `0 0 ${3 + Math.random()*5}px color-mix(in srgb, ${particleColor} 65%, white 35%),
                0 0 ${9 + Math.random()*12}px ${particleColor}`;
    }else if(kindRoll < .88){
      size = 2.5 + Math.random()*4.0;
      width = height = size;
      blur = .4 + Math.random()*1.2;
      baseOpacity = .24 + Math.random()*.42;
      bg = `color-mix(in srgb, ${particleColor} 58%, white 42%)`;
      shadow = `0 0 ${8 + Math.random()*12}px color-mix(in srgb, ${particleColor} 55%, white 45%),
                0 0 ${15 + Math.random()*20}px ${particleColor}`;
    }else{
      width = 5 + Math.random()*10;
      height = .8 + Math.random()*1.5;
      blur = Math.random()*.55;
      baseOpacity = .22 + Math.random()*.36;
      bg = `linear-gradient(90deg,transparent,color-mix(in srgb, ${particleColor} 78%, white 22%),transparent)`;
      shadow = `0 0 ${5 + Math.random()*7}px rgba(255,255,255,.55)`;
    }

    p.style.left = x.toFixed(2)+'%';
    p.style.top = y.toFixed(2)+'%';
    p.style.width = width.toFixed(2)+'px';
    p.style.height = height.toFixed(2)+'px';
    p.style.opacity = baseOpacity.toFixed(2);
    p.style.filter = `blur(${blur.toFixed(2)}px)`;
    p.style.background = bg;
    p.style.boxShadow = shadow;


    if(Math.random() < .18){
      p.style.background = `radial-gradient(circle at 35% 35%, rgba(255,255,255,.78) 0 8%, color-mix(in srgb, ${particleColor} 92%, white 8%) 26%, ${particleColor} 58%, transparent 76%)`;
      p.style.boxShadow = `0 0 10px ${particleColor}, 0 0 22px color-mix(in srgb, ${particleColor} 60%, transparent)`;
    }

    const move = ()=>{
      if(field.classList.contains('hidden')) return;

      // Organic, non-uniform drift
      const dx = Math.random()*26 - 13;
      const dy = Math.random()*30 - 15;
      const scale = 0.72 + Math.random()*.62;
      const rotation = Math.random()*34 - 17;
      const duration = 3.8 + Math.random()*6.8;
      const targetOpacity = 0.26 + Math.random()*.58;
      const targetBlur = Math.random() < .22 ? (.25 + Math.random()*1.2) : 0;

      p.style.setProperty('--dust-duration', duration.toFixed(2)+'s');
      p.style.transform =
        `translate3d(${dx.toFixed(1)}px,${dy.toFixed(1)}px,0) ` +
        `scale(${scale.toFixed(2)}) rotate(${rotation.toFixed(1)}deg)`;
      p.style.opacity = targetOpacity.toFixed(2);
      p.style.filter = `blur(${targetBlur.toFixed(2)}px)`;

      const pause = 180 + Math.random()*1600;
      const timer = setTimeout(move, duration*1000 + pause);
      dustTimers.push(timer);
    };

    const initial = setTimeout(move, Math.random()*1800);
    dustTimers.push(initial);
  });
}


function resetQrState(){
  const qr = document.getElementById('qrImage');
  const particles = document.getElementById('qrParticles');
  const btn = document.getElementById('showBtn');
  const text = document.getElementById('showText');

  stopDustMotion();

  if(qr){
    qr.classList.remove('show');
    qr.style.removeProperty('filter');
    qr.style.removeProperty('transform');
    qr.style.removeProperty('opacity');
  }

  if(particles){
    particles.classList.remove('hidden');
    // Clear JS-generated transforms/opacity/filter from every particle
    particles.querySelectorAll('i').forEach(p=>{
      p.style.removeProperty('transform');
      p.style.removeProperty('opacity');
      p.style.removeProperty('filter');
    });
  }

  if(btn) btn.classList.remove('revealed');
  if(text) text.textContent = 'VER CÓDIGO';
}


function getMorphData(type){
  const button = document.getElementById(type==='yape' ? 'btnYape' : 'btnPlin');
  const modal = document.getElementById('modal');
  const card = modal.querySelector('.card,.modal-card');
  if(!button || !card) return null;

  // Ensure modal/card are measurable
  const br = button.getBoundingClientRect();
  const cr = card.getBoundingClientRect();

  const buttonCx = br.left + br.width/2;
  const buttonCy = br.top + br.height/2;
  const cardCx = cr.left + cr.width/2;
  const cardCy = cr.top + cr.height/2;

  return {
    button,
    x: buttonCx - cardCx,
    y: buttonCy - cardCy,
    sx: Math.max(.12, br.width / cr.width),
    sy: Math.max(.08, br.height / cr.height)
  };
}


function setMorphWalletSurface(type){
  const modal = document.getElementById('modal');
  if(!modal) return;
  if(type==='plin'){
    modal.style.setProperty('--wallet-surface','#0DBED3');
    modal.style.setProperty('--wallet-surface-2','#087FE9');
  }else{
    modal.style.setProperty('--wallet-surface','#741D86');
    modal.style.setProperty('--wallet-surface-2','#56066B');
  }
}

function prepareMorph(type){
  const modal = document.getElementById('modal');
  modal.classList.remove('morph-start','morph-expand','morph-collapse');

  // Temporarily display to measure the modal card at full size
  modal.style.visibility='hidden';
  modal.style.opacity='1';
  modal.style.display='flex';

  const data = getMorphData(type);

  modal.style.display='';
  modal.style.visibility='';
  modal.style.opacity='';

  if(!data) return null;

  modal.style.setProperty('--origin-x', data.x+'px');
  modal.style.setProperty('--origin-y', data.y+'px');

  data.button.classList.add('morph-source');
  return data;
}

  modalWallet = type;

  if(type==='yape'){
    document.body.classList.add('focus-yape','modal-yape');
  }else{
    document.body.classList.add('focus-plin','modal-plin');
  }

  document.getElementById('modalLogo').innerHTML=type==='yape'?LOGO_YAPE:LOGO_PLIN;

  const modal=document.getElementById('modal');
  if(type==='yape'){
    modal.style.setProperty('--wallet-glow','rgba(101,10,123,.48)');
    modal.style.setProperty('--wallet-glow-soft','rgba(116,34,132,.22)');
  }else{
    modal.style.setProperty('--wallet-glow','rgba(12,190,203,.46)');
    modal.style.setProperty('--wallet-glow-soft','rgba(11,142,243,.20)');
  }

  resetQrState();
  const qr=document.getElementById('qrImage');
  qr.src=type==='yape'?QR_YAPE:QR_PLIN;

  modal.classList.remove('closing','morph-start','morph-expand','morph-collapse');
  modal.classList.add('open');
  requestAnimationFrame(startDustMotion);
}
function closeModal(){
  const modal = document.getElementById('modal');
  if(!modal || !modal.classList.contains('open')) return;

  modal.classList.add('closing');

  setTimeout(()=>{
    resetQrState();
    modal.classList.remove('open','closing','morph-start','morph-expand','morph-collapse');

    modalWallet = null;
    document.body.classList.remove(
      'focus-yape','focus-plin','modal-yape','modal-plin','modal-open'
    );

    document.querySelectorAll('.pay-btn.morph-source')
      .forEach(btn=>btn.classList.remove('morph-source'));
  }, 355);
}
function toggleQR(){
  const qr=document.getElementById('qrImage');
  const particles=document.getElementById('qrParticles');
  const btn=document.getElementById('showBtn');
  const text=document.getElementById('showText');

  const shown=qr.classList.toggle('show');
  particles.classList.toggle('hidden',shown);
  btn.classList.toggle('revealed',shown);
  text.textContent=shown?'OCULTAR CÓDIGO':'VER CÓDIGO';

  if(shown){
    qr.style.filter='none';
    qr.style.transform='none';
    qr.style.opacity='1';
  }else{
    qr.style.filter='';
    qr.style.transform='';
    qr.style.opacity='';
  }

  if(shown){
    stopDustMotion();
  }else{
    requestAnimationFrame(startDustMotion);
  }
}
